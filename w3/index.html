<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>เกมสัปดาห์ที่ 3 สินค้าราคาถูกจากจีน</title>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2340;--cream:#fff7ec;--c0:#ff6b4a;--c1:#14a89a;--c2:#f5a524;--c3:#5b6cff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Sarabun,sans-serif;color:var(--ink);background:var(--cream);background-image:radial-gradient(#f1dfc6 1.2px,transparent 1.2px);background-size:18px 18px;min-height:100vh;min-height:100dvh}
h1,h2,.mitr{font-family:Mitr,Sarabun,sans-serif;font-weight:600}
.scr{display:none;min-height:100vh;min-height:100dvh;flex-direction:column;padding:16px 16px 60px}
.scr.on{display:flex}
.c{align-items:center;justify-content:center;text-align:center;gap:12px}
.card{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink)}
.box{padding:18px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
input{font:700 19px Sarabun;padding:12px;border-radius:12px;border:3px solid var(--ink);text-align:center;width:100%;background:#fff}
input:focus{outline:none;border-color:var(--c3)}
.btn{font:500 19px Mitr;background:var(--c0);color:#fff;border:3px solid var(--ink);border-radius:12px;padding:11px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}
.btn:active{transform:translate(3px,3px);box-shadow:none}
.btn:disabled{opacity:.4}
.err{color:#d00;font-weight:700;min-height:20px;font-size:15px}
h1{font-size:23px;line-height:1.3}
.sub{font-size:15px;color:#555;font-weight:600}
.pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick button{background:#fff;border:3px solid #ddd;border-radius:14px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px Sarabun;color:var(--ink);cursor:pointer}
.pick button.on{border-color:var(--ink);background:#fff4cf;box-shadow:3px 3px 0 var(--ink)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;margin-bottom:10px;gap:8px}
.chip{background:var(--ink);color:var(--cream);padding:3px 10px;border-radius:20px;font-family:Mitr;font-weight:500}
.track{height:10px;border:2px solid var(--ink);border-radius:10px;background:#fff;overflow:hidden;margin-bottom:10px}
.track i{display:block;height:100%;background:var(--c1);transition:width .3s linear}
.q{padding:14px;font:500 17px Mitr;line-height:1.45;margin-bottom:12px}
.q .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--c3)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
.o{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:12px;font:700 17px Sarabun;color:var(--ink);text-align:left;box-shadow:4px 4px 0 var(--ink);cursor:pointer;min-height:64px}
.o:active{transform:translate(3px,3px);box-shadow:none}
.let{flex:none;width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:600 20px Mitr}
.res{padding:20px;width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:6px}
.res .big{font:600 44px Mitr;line-height:1.1}
.res.ok .big{color:var(--c1)}.res.no .big{color:var(--c0)}
.sc{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;margin-top:8px}
.sc div{border:2px solid var(--ink);border-radius:12px;padding:8px;background:#fff}
.sc small{display:block;font-size:13px;font-weight:700;color:#666}.sc b{font:600 22px Mitr}
.me{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:#fff;display:flex;align-items:center;gap:10px;padding:6px 14px;font-weight:700;font-size:15px}
.me .sp{flex:1}
</style></head><body>

<section class="scr on c" id="sJoin">
 <img src="../emblem.png" style="width:64px;height:64px;object-fit:contain" alt="">
 <h1>เกมสินค้าราคาถูกจากจีน</h1><div class="sub">เหตุการณ์ปัจจุบัน 2 สัปดาห์ที่ 3</div>
 <div class="card box">
  <input id="pin" inputmode="numeric" maxlength="6" placeholder="รหัสเกม 6 หลัก">
  <input id="name" maxlength="30" placeholder="ชื่อเล่น และเลขที่ เช่น ต้น 12">
  <div class="mitr" style="font-weight:500;text-align:left">เลือกตัวละคร</div>
  <div class="pick" id="pick"></div>
  <button class="btn" onclick="join()">เข้าเกม</button>
  <div class="err" id="jerr"></div>
 </div>
</section>

<section class="scr c" id="sWait">
 <div id="wAv"></div>
 <h1 id="wTitle">เข้าเกมแล้ว</h1><div class="sub" id="wSub">ดูตัวละครของตัวเองบนจอทีวี แล้วรอครูเริ่มเกม</div>
</section>

<section class="scr" id="sQ">
 <div class="bar"><span class="chip" id="qRound"></span><span id="qTime"></span></div>
 <div class="track"><i id="tb"></i></div>
 <div class="card q" id="qText"></div>
 <div class="grid" id="qOpts"></div>
 <div id="qType" style="display:none;flex-direction:column;gap:10px">
  <input id="txt" maxlength="40" placeholder="พิมพ์คำที่หายไป" autocomplete="off">
  <button class="btn" onclick="sendTxt()">ส่งคำตอบ</button>
 </div>
</section>

<section class="scr c" id="sRes"><div class="card res" id="res"></div></section>

<div class="me" id="me" style="display:none"><span id="meAv"></span><span id="meName"></span><span class="sp"></span><span id="meScore"></span></div>

<script src="common.js"></script><script src="data.js"></script>
<script>
const D = window.K3; const $ = id => document.getElementById(id);
let me = JSON.parse(localStorage.getItem("k3_me") || "null"), lastKey = "", answered = {}, qShownAt = 0, cdIv, curQ = -1, av = Math.random() * 8 | 0;
const sp = new URLSearchParams(location.search); if (sp.get("pin")) $("pin").value = sp.get("pin");
const show = id => document.querySelectorAll(".scr").forEach(s => s.classList.toggle("on", s.id === id));
function drawPick() { $("pick").innerHTML = AV_NAMES.map((n, i) => `<button class="${i === av ? "on" : ""}" onclick="av=${i};drawPick()">${avEl(i, i === av ? "bob" : "", i === av ? "happy" : "normal", "52px")}<span>${n}</span></button>`).join(""); }
drawPick();

async function join() {
  const p = $("pin").value.trim(), n = $("name").value.trim(), e = $("jerr");
  if (!p || !n) { e.textContent = "กรอกรหัสเกมและชื่อให้ครบ"; return; }
  try {
    const id = await rpc("k3_join", { p_pin: p, p_name: n, p_avatar: av });
    me = { id, pin: p, name: n, av }; localStorage.setItem("k3_me", JSON.stringify(me)); answered = {};
    start();
  } catch (x) {
    e.textContent = x.message.includes("BADPIN") ? "รหัสเกมไม่ถูกต้อง หรือเกมยังไม่เปิด" : x.message.includes("DUPNAME") ? "ชื่อนี้มีคนใช้แล้ว เติมเลขที่ต่อท้าย" : "เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง";
  }
}
function start() {
  $("me").style.display = "flex"; $("meName").textContent = me.name; $("meAv").innerHTML = avEl(me.av, "", "normal", "30px");
  waitMsg("เข้าเกมแล้ว", "ดูตัวละครของตัวเองบนจอทีวี แล้วรอครูเริ่มเกม", "bob");
  loop(); setInterval(loop, 1000);
}
async function loop() {
  let g; try { g = await getGame(); } catch (e) { return; }
  if (!g) return;
  if (g.pin !== me.pin) { if (g.pin) { localStorage.removeItem("k3_me"); location.href = location.pathname; } return; }
  const key = g.phase + ":" + g.qi; if (key === lastKey) return; lastKey = key;
  if (g.phase === "lobby") waitMsg("เข้าเกมแล้ว", "ดูตัวละครของตัวเองบนจอทีวี แล้วรอครูเริ่มเกม", "bob");
  else if (g.phase === "question") showQ(g.qi);
  else if (g.phase === "reveal") showRes(g.qi);
  else if (g.phase === "board") showRank("คะแนนรวม");
  else if (g.phase === "end") showRank("จบเกม", true);
}
function waitMsg(a, b, cls) { clearInterval(cdIv); $("wAv").innerHTML = avEl(me.av, cls || "walk", "normal", "120px"); $("wTitle").textContent = a; $("wSub").textContent = b; show("sWait"); }
function showQ(i) {
  const Q = D.Q[i]; clearInterval(cdIv); curQ = i;
  if (answered[i]) { waitMsg("ส่งคำตอบแล้ว", "รอครูเฉลยบนจอ"); return; }
  $("qRound").textContent = "ข้อ " + (i + 1) + (Q.kind === "poll" ? " โพล" : Q.dbl ? " คะแนนสองเท่า" : "");
  $("qText").innerHTML = esc(Q.q).replace("______", '<span class="blank">&nbsp;</span>');
  if (Q.kind === "type") { $("qOpts").style.display = "none"; $("qType").style.display = "flex"; $("txt").value = ""; setTimeout(() => $("txt").focus(), 100); }
  else {
    $("qType").style.display = "none"; $("qOpts").style.display = "grid";
    $("qOpts").innerHTML = Q.opts.map((x, k) => `<button class="o" onclick="send(${i},${k},null)"><span class="let" style="background:${COLORS[k]}">${LETTERS[k]}</span><span>${esc(x)}</span></button>`).join("");
  }
  qShownAt = Date.now();
  const cd = () => { const el = (Date.now() - qShownAt) / 1000, l = Math.max(0, Math.ceil(Q.t - el)); $("qTime").textContent = l + " วินาที"; $("tb").style.width = Math.max(0, 100 - el / Q.t * 100) + "%"; $("tb").style.background = l <= 5 ? "var(--c0)" : "var(--c1)"; };
  cd(); cdIv = setInterval(cd, 250); show("sQ");
}
async function send(i, choice, txt) {
  answered[i] = true; waitMsg("ส่งคำตอบแล้ว", "รอครูเฉลยบนจอ");
  try { const r = await rpc("k3_answer", { p_player: me.id, p_qi: i, p_choice: choice, p_txt: txt }); if (r === "CLOSED" || r === "LATE") waitMsg("หมดเวลา", "รอข้อถัดไป", "sad"); } catch (e) { waitMsg("ส่งไม่สำเร็จ", "รอข้อถัดไป", "sad"); }
}
function sendTxt() { const v = $("txt").value.trim(); if (v) send(curQ, null, v); }
$("txt").addEventListener("keydown", e => { if (e.key === "Enter") sendTxt(); });
async function showRes(i) {
  clearInterval(cdIv); const Q = D.Q[i], m = await rpc("k3_mine", { p_player: me.id, p_qi: i });
  $("meScore").textContent = m.score + " คะแนน";
  const r = $("res");
  if (Q.kind === "poll") { r.className = "card res"; r.innerHTML = avEl(me.av, "bob", "happy", "110px") + `<h1>${m.answered ? "ขอบคุณที่ตอบ" : "ข้อนี้ไม่ได้ตอบ"}</h1><div class="sub">ดูผลของทั้งห้องบนจอทีวี</div>`; }
  else if (m.correct) {
    r.className = "card res ok";
    r.innerHTML = avEl(me.av, "jump", "happy", "120px") + `<div class="big">ถูก</div><div class="sub">ตอบใน ${m.sec} วินาที</div><div class="sc"><div><small>ความถูก</small><b>+${m.pts_ok}</b></div><div><small>ความเร็ว</small><b>+${m.pts_speed}</b></div></div><div class="sub" style="margin-top:6px">ตอนนี้อันดับที่ ${m.rank}</div>`;
  } else {
    r.className = "card res no";
    r.innerHTML = avEl(me.av, "sad", "sad", "110px") + `<div class="big">${m.answered ? "ยังไม่ถูก" : "หมดเวลา"}</div>${Q.kind === "type" ? `<div style="font-weight:700">คำตอบคือ ${esc(Q.ans)}</div>` : ""}<div class="sub">ข้อหน้าเอาใหม่ ตอนนี้อันดับที่ ${m.rank}</div>`;
  }
  show("sRes");
}
async function showRank(title, end) {
  const m = await rpc("k3_mine", { p_player: me.id, p_qi: -1 });
  $("meScore").textContent = m.score + " คะแนน";
  const r = $("res"); r.className = "card res";
  r.innerHTML = avEl(me.av, m.rank <= 3 ? "jump" : "bob", "happy", "110px") + `<div class="sub">${title}</div><div class="big">อันดับ ${m.rank}</div><div class="sc"><div><small>ความถูก</small><b>${m.score_ok}</b></div><div><small>ความเร็ว</small><b>${m.score_speed}</b></div></div><div class="mitr" style="font-size:20px;margin-top:6px">รวม ${m.score} คะแนน</div>${end ? '<div class="sub" style="margin-top:10px">คาบหน้าเตรียมคำถามมาถามตัวละครคนละ 1 ข้อ</div>' : ""}`;
  show("sRes");
}
if (me) getGame().then(g => { if (g && g.pin === me.pin && g.phase !== "end") { if (me.av == null) me.av = 0; start(); } else { localStorage.removeItem("k3_me"); me = null; } });
</script>
</body></html>
