<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>หน้าครู เกมสัปดาห์ที่ 3</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sarabun,sans-serif;background:linear-gradient(135deg,#2b0f54,#46178f 55%,#1b4d9c);color:#fff;min-height:100vh;overflow:hidden}
.scr{display:none;min-height:100vh;flex-direction:column;padding:2.2vw 3vw}
.scr.on{display:flex}
.top{display:flex;align-items:center;gap:1.5vw;font-size:1.3vw;opacity:.9}
.top .sp{flex:1}
.btn{background:#fff;color:#2b0f54;border:none;border-radius:.6vw;font:800 1.5vw Sarabun;padding:.8vw 2.2vw;cursor:pointer;box-shadow:0 .35vw 0 rgba(0,0,0,.25)}
.btn:active{transform:translateY(.2vw);box-shadow:none}
.btn.g{background:#26890c;color:#fff}.btn.s{font-size:1.1vw;padding:.5vw 1.2vw;background:rgba(255,255,255,.15);color:#fff;box-shadow:none}
.card{background:#fff;color:#222;border-radius:1vw;padding:2vw}
input{font:600 1.6vw Sarabun;padding:.8vw 1.2vw;border-radius:.6vw;border:2px solid #ccc;width:22vw;text-align:center}
/* lobby */
.lob{display:grid;grid-template-columns:1fr auto;gap:3vw;align-items:center;margin-top:1.5vw}
.pinbox{background:#fff;color:#222;border-radius:1vw;padding:1.5vw 2.5vw}
.pinbox small{font-size:1.4vw;color:#555}.pinbox .url{font-size:2vw;font-weight:800;color:#46178f}
.pin{font-size:7vw;font-weight:800;letter-spacing:.6vw;line-height:1.05}
#qr{background:#fff;padding:1vw;border-radius:1vw}#qr img{width:15vw;height:15vw;display:block;image-rendering:pixelated}
.names{display:flex;flex-wrap:wrap;gap:.8vw;margin-top:2vw;align-content:flex-start;flex:1;overflow:hidden}
.names span{background:rgba(255,255,255,.18);padding:.5vw 1.3vw;border-radius:2vw;font-size:1.6vw;font-weight:600;animation:pop .35s}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.cnt{font-size:2vw;font-weight:800}
/* question */
.round{font-size:1.5vw;font-weight:600;background:rgba(0,0,0,.25);padding:.3vw 1.2vw;border-radius:2vw}
.qtext{background:#fff;color:#1d1d1d;border-radius:1vw;font-size:3vw;font-weight:800;text-align:center;padding:2vw 3vw;margin:1.5vw 0;line-height:1.3}
.qtext .blank{display:inline-block;min-width:10vw;border-bottom:.35vw solid #46178f;color:#46178f}
.mid{display:flex;align-items:center;justify-content:space-between;flex:1}
.timer{width:9vw;height:9vw;border-radius:50%;background:#864cbf;display:flex;align-items:center;justify-content:center;font-size:4vw;font-weight:800}
.ansn{text-align:center;font-size:1.5vw}.ansn b{display:block;font-size:4vw}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1vw;margin-top:1vw}
.opt{display:flex;align-items:center;gap:1.2vw;border-radius:.6vw;padding:1.2vw 1.5vw;font-size:2vw;font-weight:800;min-height:7vw;transition:opacity .3s}
.opt svg{width:3vw;height:3vw;flex:none}
.opt.dim{opacity:.25}.opt .ok{margin-left:auto;font-size:2.6vw}
.typehint{text-align:center;font-size:2.2vw;font-weight:600;background:rgba(0,0,0,.2);border-radius:1vw;padding:1.5vw}
/* reveal */
.bars{display:flex;gap:2vw;align-items:flex-end;justify-content:center;height:16vw;margin:1vw 0}
.bar{width:8vw;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .b{width:100%;border-radius:.5vw .5vw 0 0;min-height:.6vw;transition:height .8s}
.bar .v{font-size:2vw;font-weight:800;margin-bottom:.3vw}
.bar .ic{width:100%;padding:.4vw 0;display:flex;justify-content:center;border-radius:0 0 .5vw .5vw}.bar .ic svg{width:2vw;height:2vw}
.exp{background:#fff;color:#222;border-radius:1vw;padding:1.3vw 2vw;font-size:1.65vw;line-height:1.45}
.exp b{color:#46178f}.exp .src{font-size:1.1vw;color:#777;margin-top:.5vw}
.talk{background:#ffd84d;color:#222;border-radius:1vw;padding:1vw 2vw;font-size:1.7vw;font-weight:600;margin-top:1vw}
.words{display:flex;flex-wrap:wrap;gap:.8vw;justify-content:center;margin:1vw 0}
.words span{background:rgba(255,255,255,.15);padding:.5vw 1.3vw;border-radius:.6vw;font-size:1.7vw;font-weight:600}
.words span.y{background:#26890c}
.answord{text-align:center;font-size:4vw;font-weight:800;margin-top:.5vw}
.answord small{font-size:1.6vw;font-weight:600;display:block;opacity:.85}
/* board */
.lb{display:flex;flex-direction:column;gap:1vw;width:60vw;margin:2vw auto}
.lb div{display:flex;justify-content:space-between;background:#fff;color:#222;border-radius:.6vw;padding:1vw 2vw;font-size:2.2vw;font-weight:800;animation:pop .4s backwards}
.lb div:first-child{background:#ffd84d}
h2{font-size:3.4vw;text-align:center;font-weight:800}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:1.5vw;margin-top:3vw;flex:1}
.pod div{width:18vw;text-align:center;font-weight:800}
.pod .st{background:#fff;color:#46178f;border-radius:.8vw .8vw 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:1vw;font-size:4vw}
.pod .nm{font-size:2.2vw;margin-bottom:.5vw}.pod .sc{font-size:1.4vw;opacity:.85;margin-bottom:.6vw}
.foot{display:flex;justify-content:flex-end;gap:1vw;margin-top:1vw}
.err{color:#ffb4b4;font-size:1.3vw;margin-top:.8vw;min-height:1.6vw}
</style></head><body>

<section class="scr on" id="sLogin" style="align-items:center;justify-content:center;text-align:center;gap:1.5vw">
 <img src="../emblem.png" style="width:7vw;height:7vw;object-fit:contain" alt=""><div style="font-size:1.6vw;opacity:.85" id="course"></div>
 <h2 id="title" style="max-width:70vw"></h2>
 <div class="card" style="display:flex;flex-direction:column;gap:1vw;align-items:center;margin-top:1vw">
  <div style="font-size:1.5vw;font-weight:600">รหัสครู</div>
  <input id="code" type="password" inputmode="numeric" placeholder="รหัสครู">
  <button class="btn g" onclick="login()">สร้างห้องเกม</button>
  <div class="err" id="lerr" style="color:#c00"></div>
 </div>
</section>

<section class="scr" id="sLobby">
 <div class="top"><img src="../emblem.png" style="width:3.2vw;height:3.2vw;object-fit:contain" alt=""><span class="round" id="lobTitle"></span><span class="sp"></span><button class="btn s" onclick="mute(this)">ปิดเสียง</button></div>
 <div class="lob">
  <div class="pinbox">
   <small>เข้าเว็บ</small><div class="url" id="url"></div>
   <small>แล้วพิมพ์รหัสเกม</small><div class="pin" id="pin"></div>
  </div>
  <div id="qr"></div>
 </div>
 <div style="display:flex;align-items:center;gap:2vw;margin-top:1.5vw"><div class="cnt"><span id="pc">0</span> คน</div><span class="sp" style="flex:1"></span><button class="btn g" onclick="startGame()">เริ่มเกม</button></div>
 <div class="names" id="names"></div>
</section>

<section class="scr" id="sQ">
 <div class="top"><span class="round" id="qRound"></span><span id="qNo"></span><span class="sp"></span><button class="btn s" onclick="mute(this)">ปิดเสียง</button><button class="btn s" onclick="doReveal()">ข้ามไปเฉลย</button></div>
 <div class="qtext" id="qText"></div>
 <div class="mid"><div class="timer" id="tm">20</div><div id="qMid" style="flex:1;padding:0 3vw"></div><div class="ansn"><b id="an">0</b>คำตอบ</div></div>
 <div class="opts" id="qOpts"></div>
</section>

<section class="scr" id="sR">
 <div class="top"><span class="round" id="rRound"></span><span class="sp"></span><button class="btn s" onclick="mute(this)">ปิดเสียง</button></div>
 <div class="qtext" id="rText" style="font-size:2.3vw;padding:1.2vw 2vw;margin:1vw 0"></div>
 <div id="rBody" style="flex:1"></div>
 <div class="foot"><button class="btn" id="nextBtn" onclick="nextStep()">ถัดไป</button></div>
</section>

<section class="scr" id="sB">
 <h2 id="bTitle">คะแนนรวม</h2>
 <div class="lb" id="lb"></div>
 <div class="foot" style="margin-top:auto"><button class="btn" onclick="nextStep()">ถัดไป</button></div>
</section>

<section class="scr" id="sEnd">
 <h2>อันดับสุดท้าย</h2>
 <div class="pod" id="pod"></div>
 <div style="text-align:center;font-size:1.8vw;margin-top:1.5vw;font-weight:600">คาบหน้า ตัวละคร 4 คนจะมานั่งหน้าห้อง เตรียมคำถามมาคนละ 1 ข้อ</div>
</section>

<script src="common.js"></script><script src="data.js"></script>
<script>
const D = window.K3; let code = "", pin = "", qi = -1, players = [], tStart = 0, tLeft = 0, tIv, poll, revealed = false;
document.getElementById("course").textContent = D.course;
document.getElementById("title").textContent = D.title;
document.getElementById("lobTitle").textContent = D.course;
const show = id => { document.querySelectorAll(".scr").forEach(s => s.classList.toggle("on", s.id === id)); };
function mute(b) { const m = Music.toggle(); document.querySelectorAll(".top .btn.s:first-of-type").forEach(x => x.textContent = m ? "เปิดเสียง" : "ปิดเสียง"); }

async function login() {
  code = document.getElementById("code").value.trim();
  try {
    pin = await rpc("k3_teacher", { p_code: code, p_action: "new" });
    const url = location.origin + location.pathname.replace(/host(\.html)?$/, "");
    document.getElementById("url").textContent = (location.host + location.pathname.replace(/host(\.html)?$/, "")).replace(/\/$/, "");
    document.getElementById("pin").textContent = pin;
    const q = qrcode(0, "M"); q.addData(url + "?pin=" + pin); q.make();
    document.getElementById("qr").innerHTML = q.createImgTag(6, 0);
    show("sLobby"); Music.play("lobby");
    clearInterval(poll); poll = setInterval(lobbyPoll, 1500); lobbyPoll();
  } catch (e) { document.getElementById("lerr").textContent = e.message.includes("BADCODE") ? "รหัสครูไม่ถูกต้อง" : "เชื่อมต่อไม่ได้ " + e.message; }
}
let shown = new Set();
async function lobbyPoll() {
  players = await getPlayers(pin);
  document.getElementById("pc").textContent = players.length;
  const box = document.getElementById("names");
  players.slice().reverse().forEach(p => { if (!shown.has(p.id)) { shown.add(p.id); const s = document.createElement("span"); s.textContent = p.name; box.prepend(s); } });
}
function startGame() { clearInterval(poll); goQ(0); }

async function goQ(i) {
  qi = i; revealed = false; const Q = D.Q[i];
  await rpc("k3_teacher", { p_code: code, p_action: "question", p_qi: i });
  players = await getPlayers(pin);
  document.getElementById("qRound").textContent = Q.round;
  document.getElementById("qNo").textContent = "ข้อ " + (i + 1) + " / " + D.Q.length + (Q.kind === "poll" ? "  โพล ไม่คิดคะแนน" : Q.kind === "type" ? "  พิมพ์คำตอบ" : "");
  document.getElementById("qText").innerHTML = esc(Q.q).replace("______", '<span class="blank">&nbsp;</span>');
  const o = document.getElementById("qOpts"), mid = document.getElementById("qMid");
  if (Q.kind === "type") { o.innerHTML = ""; mid.innerHTML = '<div class="typehint">พิมพ์คำที่หายไปในมือถือ สะกดให้ถูก</div>'; }
  else { mid.innerHTML = ""; o.innerHTML = Q.opts.map((t, k) => `<div class="opt" style="background:${COLORS[k]}">${SHAPES[k]}<span>${esc(t)}</span></div>`).join(""); }
  document.getElementById("an").textContent = 0;
  show("sQ"); Music.play("question");
  tStart = Date.now(); tLeft = Q.t; document.getElementById("tm").textContent = tLeft;
  clearInterval(tIv); tIv = setInterval(tick, 250);
  clearInterval(poll); poll = setInterval(qPoll, 1200);
}
function tick() {
  const left = Math.max(0, D.Q[qi].t - Math.floor((Date.now() - tStart) / 1000));
  if (left !== tLeft) { tLeft = left; document.getElementById("tm").textContent = left; if (left <= 5 && left > 0) Music.tick(); }
  if (left <= 0) doReveal();
}
async function qPoll() {
  const s = await rpc("k3_stats", { p_pin: pin, p_qi: qi });
  document.getElementById("an").textContent = s.n;
  if (players.length && s.n >= players.length) doReveal();
}
async function doReveal() {
  if (revealed) return; revealed = true;
  clearInterval(tIv); clearInterval(poll);
  await rpc("k3_teacher", { p_code: code, p_action: "reveal" });
  const Q = D.Q[qi], s = await rpc("k3_stats", { p_pin: pin, p_qi: qi });
  Music.stop(); Music.sting(true);
  document.getElementById("rRound").textContent = Q.round;
  document.getElementById("rText").innerHTML = esc(Q.q).replace("______", '<span class="blank">' + (Q.kind === "type" ? esc(Q.ans) : "&nbsp;") + "</span>");
  let h = "";
  if (Q.kind === "type") {
    h += `<div class="answord"><small>คำตอบ</small>${esc(Q.ans)}<small>ตอบถูก ${s.right} จาก ${s.n} คน</small></div>`;
    h += '<div class="words">' + s.texts.slice(0, 12).map(w => `<span class="${w.ok ? "y" : ""}">${esc(w.t)} (${w.c})</span>`).join("") + "</div>";
  } else {
    const n = Q.opts.length, mx = Math.max(1, ...Array.from({ length: n }, (_, k) => s.counts[k] || 0));
    h += '<div class="bars">' + Q.opts.map((t, k) => { const v = s.counts[k] || 0, dim = Q.kind === "choice" && k !== Q.ans;
      return `<div class="bar" style="opacity:${dim ? .35 : 1}"><div class="v">${v}</div><div class="b" style="background:${COLORS[k]};height:${v / mx * 75}%"></div><div class="ic" style="background:${COLORS[k]}">${SHAPES[k]}</div></div>`; }).join("") + "</div>";
    h += '<div class="opts" style="grid-template-columns:repeat(' + (n === 2 ? 2 : 4) + ',1fr)">' + Q.opts.map((t, k) => `<div class="opt ${Q.kind === "choice" && k !== Q.ans ? "dim" : ""}" style="background:${COLORS[k]};font-size:1.5vw;min-height:4.5vw">${SHAPES[k]}<span>${esc(t)}</span>${Q.kind === "choice" && k === Q.ans ? '<span class="ok">ถูก</span>' : ""}</div>`).join("") + "</div>";
  }
  if (Q.exp) h += `<div class="exp" style="margin-top:1vw"><b>สรุป</b> ${esc(Q.exp)}${Q.src ? `<div class="src">ที่มา: ${esc(Q.src)}</div>` : ""}</div>`;
  if (Q.talk) h += `<div class="talk">ครูถามต่อ: ${esc(Q.talk)}</div>`;
  document.getElementById("rBody").innerHTML = h;
  const nextIsBoard = Q.kind === "type" || qi === D.Q.length - 1;
  document.getElementById("nextBtn").textContent = qi === D.Q.length - 1 ? "ดูอันดับสุดท้าย" : nextIsBoard ? "ดูคะแนนรวม" : "ข้อถัดไป";
  show("sR");
}
async function board() {
  await rpc("k3_teacher", { p_code: code, p_action: "board" });
  players = await getPlayers(pin);
  document.getElementById("lb").innerHTML = players.slice(0, 5).map((p, i) => `<div style="animation-delay:${i * .12}s"><span>${i + 1}. ${esc(p.name)}</span><span>${p.score}</span></div>`).join("");
  show("sB"); Music.play("lobby");
}
let stage = "r";
async function nextStep() {
  const Q = D.Q[qi];
  if (document.getElementById("sR").classList.contains("on")) {
    if (qi === D.Q.length - 1) return finish();
    if (Q.kind === "type") return board();
    return goQ(qi + 1);
  }
  if (document.getElementById("sB").classList.contains("on")) return goQ(qi + 1);
}
async function finish() {
  await rpc("k3_teacher", { p_code: code, p_action: "end" });
  players = await getPlayers(pin);
  const p = players, ord = [1, 0, 2], hts = [16, 22, 12];
  document.getElementById("pod").innerHTML = ord.map(i => p[i] ? `<div><div class="nm">${esc(p[i].name)}</div><div class="sc">${p[i].score} คะแนน</div><div class="st" style="height:${hts[ord.indexOf(i)]}vw">${i + 1}</div></div>` : "").join("");
  show("sEnd"); Music.stop(); Music.fanfare();
}
document.addEventListener("keydown", e => { if (e.key === "ArrowRight") { if (document.getElementById("sQ").classList.contains("on")) doReveal(); else nextStep(); } if (e.key === "Enter" && document.getElementById("sLogin").classList.contains("on")) login(); });
</script>
</body></html>
