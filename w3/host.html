<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>จอทีวี เกมสัปดาห์ที่ 3</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{--ink:#2b2540;--cream:#fff6ee;--c0:#ff7a8a;--c1:#3cb6a0;--c2:#ffa94d;--c3:#8a7dff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Sarabun,sans-serif;color:var(--ink);min-height:100vh;overflow:hidden;background-size:7vw 7vw}
h1,h2,h3,.mali{font-family:Mali,Sarabun,sans-serif;font-weight:700}
.scr{display:none;height:100vh;flex-direction:column;padding:1.5vw 2.6vw}
.scr.on{display:flex}
.card{background:#fff;border:.2vw solid var(--ink);border-radius:1.6vw;box-shadow:0 .5vw 0 var(--ink)}
.top{display:flex;align-items:center;gap:1vw;font-size:1.25vw;font-weight:600;min-height:3.2vw}
.top img{width:3vw;height:3vw;object-fit:contain}
.chip{background:var(--ink);color:#fff;padding:.3vw 1.2vw;border-radius:2vw;font-family:Mali;font-weight:600}
.chip.alt{background:#fff;color:var(--ink);border:.15vw solid var(--ink)}
.sp{flex:1}
.btn{font:700 1.5vw Mali;background:var(--c0);color:#fff;border:.2vw solid var(--ink);border-radius:2vw;padding:.55vw 2.4vw;box-shadow:0 .35vw 0 var(--ink);cursor:pointer}
.btn:active{transform:translateY(.3vw);box-shadow:none}
.btn.s{font-size:1vw;padding:.25vw 1.1vw;background:#fff;color:var(--ink);box-shadow:0 .2vw 0 var(--ink)}
.btn.y{background:var(--c2);color:var(--ink)}
input{font:600 1.6vw Sarabun;padding:.7vw 1.2vw;border-radius:2vw;border:.2vw solid var(--ink);width:22vw;text-align:center}
#sLogin{align-items:center;justify-content:center;text-align:center;gap:1.2vw}
.parade{display:flex;gap:.8vw;justify-content:center}
.lob{display:grid;grid-template-columns:auto 1fr;gap:2vw;margin-top:1vw}
.join{display:flex;gap:1.6vw;align-items:center;padding:1.2vw 2vw}
.join small{font-size:1.25vw;font-weight:600;color:#776}
.join .url{font:700 1.8vw Mali;color:var(--c3)}
.pin{font:700 6.2vw Mali;letter-spacing:.4vw;line-height:1.05}
#qr img{width:12.5vw;height:12.5vw;display:block;image-rendering:pixelated}
.lobinfo{display:flex;flex-direction:column;justify-content:space-between;padding:1.2vw 2vw}
.lobinfo h2{font-size:2.3vw;line-height:1.3}
.cnt{font:700 3vw Mali}.cnt small{font:400 1.3vw Sarabun}
.stage{flex:1;margin-top:1.4vw;position:relative;border:.2vw solid var(--ink);border-radius:1.6vw;background:linear-gradient(#fff 0 60%,#ffe3e8 60%);overflow:hidden}
.stage .rug{position:absolute;left:0;right:0;top:0;height:1.8vw;background:repeating-linear-gradient(90deg,var(--c0) 0 3vw,#fff 3vw 6vw);border-bottom:.2vw solid var(--ink)}
.walker{position:absolute;display:flex;flex-direction:column;align-items:center;transition:left 3s linear}
.walker .tag{background:var(--ink);color:#fff;font-size:1vw;font-weight:600;padding:.1vw .7vw;border-radius:1vw;margin-top:.1vw;white-space:nowrap}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.6vw;color:#a99}
#sPart{align-items:center;justify-content:center;text-align:center;gap:1.4vw}
#sPart .pno{font:700 1.8vw Mali;background:var(--c2);border:.2vw solid var(--ink);border-radius:2vw;padding:.3vw 1.6vw}
#sPart h1{font-size:4.2vw;line-height:1.25;max-width:80vw;animation:zoom .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes zoom{from{transform:scale(.6);opacity:0}}
.qcard{padding:1.5vw 2.6vw;margin:1vw 0;font:600 2.6vw Mali;line-height:1.4;text-align:center}
.qcard .blank{display:inline-block;min-width:11vw;border-bottom:.4vw dashed var(--c3);color:var(--c3)}
.tbar{display:flex;align-items:center;gap:1vw;margin-bottom:1vw}
.track{flex:1;height:1.4vw;border:.2vw solid var(--ink);border-radius:1vw;background:#fff;overflow:hidden}
.track i{display:block;height:100%;background:var(--c1);transition:width .25s linear,background .3s}
.tnum{font:700 2.6vw Mali;width:4.5vw;text-align:right}
.qbody{display:flex;gap:1.4vw}
.qimg{flex:none;width:26vw;padding:.8vw;display:flex;align-items:center;justify-content:center;background:#fffaf4}.qimg img{max-width:100%;max-height:44vh;display:block;border-radius:1vw;object-fit:contain}
.flip{position:relative}.flip .s{animation:shk .8s ease-in-out,fout .35s .8s forwards}
.flip .r{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:rpop .8s .95s cubic-bezier(.3,1.6,.5,1) forwards;max-width:calc(100% - 1.6vw)}
@keyframes shk{20%,60%{transform:rotate(-6deg)}40%,80%{transform:rotate(6deg)}}
@keyframes fout{to{opacity:0;transform:scale(1.15)}}
@keyframes rpop{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:1.1vw;flex:1}
.qbody.img .opts{grid-template-columns:1fr}
.opt{display:flex;align-items:center;gap:1.2vw;padding:.9vw 1.4vw;font-size:1.9vw;font-weight:800;min-height:5.6vw;background:#fff;border:.2vw solid var(--ink);border-radius:3vw;box-shadow:0 .35vw 0 var(--ink);animation:slide .4s backwards}
.qbody.img .opt{min-height:4.4vw;font-size:1.7vw}
.opt:nth-child(2){animation-delay:.08s}.opt:nth-child(3){animation-delay:.16s}.opt:nth-child(4){animation-delay:.24s}
@keyframes slide{from{opacity:0;transform:translateY(1.5vw)}}
.let{flex:none;width:3.8vw;height:3.8vw;border-radius:50%;border:.2vw solid var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font:700 2vw Mali}
.typebox{display:flex;align-items:center;justify-content:center;gap:2vw;padding:1.4vw;font-size:2.1vw;font-weight:800;flex:1}
.sent{margin-top:auto;display:flex;align-items:flex-end;gap:1vw;min-height:6.5vw}
.sent .lbl{font:700 1.6vw Mali;white-space:nowrap;padding-bottom:.5vw}
.sent .row{display:flex;flex-wrap:wrap;gap:.2vw;align-items:flex-end;flex:1}
.rgrid{display:grid;grid-template-columns:1fr 21vw;gap:1.6vw}
.rows{display:flex;flex-direction:column;gap:.7vw}
.rrow{display:flex;align-items:center;gap:1vw;background:#fff;border:.2vw solid var(--ink);border-radius:3vw;padding:.5vw 1vw;font-size:1.55vw;font-weight:800;transition:opacity .4s}
.rrow .txt{width:42%}
.rrow .bw{flex:1;height:2vw;background:#f6ece4;border-radius:1vw;overflow:hidden}
.rrow .bw i{display:block;height:100%;width:0;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.rrow .n{width:3.5vw;text-align:right;font:700 2vw Mali}
.rrow.dim{opacity:.35}
.rrow.ok{border-color:var(--c1);box-shadow:0 .35vw 0 var(--c1)}
.rrow .mark{font:700 1.2vw Mali;background:var(--c1);color:#fff;padding:.1vw .9vw;border-radius:1vw}
.answord{text-align:center;padding:1vw}
.answord small{display:block;font-size:1.4vw;font-weight:600;color:#776}
.answord b{font:700 4.4vw Mali;color:var(--c1)}
.words{display:flex;flex-wrap:wrap;gap:.6vw;justify-content:center;margin-top:.5vw}
.words span{border:.16vw solid var(--ink);background:#fff;padding:.25vw 1vw;border-radius:2vw;font-size:1.45vw;font-weight:600}
.words span.y{background:var(--c1);color:#fff}
.fast{padding:1vw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.3vw;height:100%;justify-content:center}
.fast h3{font-size:1.4vw;margin-bottom:2.2vw}
.fast .nm{font:700 1.8vw Mali}.fast .sec{font-size:1.25vw;font-weight:600;color:#776}
.exp{padding:.9vw 1.6vw;font-size:1.45vw;line-height:1.5;margin-top:1.1vw}
.exp b{font-family:Mali;color:var(--c0)}.exp .src{font-size:1vw;color:#887;margin-top:.2vw}
.foot{display:flex;justify-content:flex-end;gap:1vw;margin-top:auto;padding-top:.8vw}
.talkpop{position:fixed;inset:0;background:rgba(43,37,64,.55);display:none;align-items:center;justify-content:center;z-index:20}
.talkpop.on{display:flex}
.talkpop .card{max-width:70vw;padding:2.4vw 3vw;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1vw;animation:zoom .4s cubic-bezier(.3,1.5,.5,1)}
.talkpop h3{font-size:1.6vw;color:var(--c0)}.talkpop p{font:700 3vw Mali;line-height:1.35}
.sumwrap{flex:1;display:grid;grid-template-columns:1fr 22vw;gap:2vw;align-items:center;margin-top:1vw}
.sumlist{display:flex;flex-direction:column;gap:1.2vw}
.sumlist div{display:flex;gap:1.2vw;align-items:flex-start;padding:1.2vw 1.6vw;font-size:1.9vw;font-weight:700;line-height:1.45;animation:slide .5s backwards}
.sumlist div:nth-child(2){animation-delay:.25s}.sumlist div:nth-child(3){animation-delay:.5s}
.sumlist .no{flex:none;width:3.4vw;height:3.4vw;border-radius:50%;background:var(--c3);color:#fff;border:.2vw solid var(--ink);display:flex;align-items:center;justify-content:center;font:700 1.8vw Mali}
.lanes{display:flex;flex-direction:column;gap:.7vw;margin-top:1vw}
.lane{display:grid;grid-template-columns:3vw 13vw 1fr 12vw;align-items:center;gap:1vw;background:#fff;border:.2vw solid var(--ink);border-radius:3vw;padding:.2vw 1.4vw;height:6.4vw;animation:slide .4s backwards}
.lane .rk{font:700 2.2vw Mali;text-align:center}
.lane .nm{font:700 1.6vw Mali;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lane .rt{position:relative;height:100%;background:radial-gradient(circle,#f6e2d3 .25vw,transparent .3vw) 0 50%/2.4vw 2.4vw repeat-x}
.lane .rt::after{content:"";position:absolute;right:0;top:15%;bottom:15%;width:.9vw;background:repeating-conic-gradient(var(--ink) 0 25%,#fff 0 50%) 0 0/.45vw .45vw;border-radius:.2vw}
.lane .runner{position:absolute;bottom:.1vw;left:0;transition:left 2s cubic-bezier(.3,.8,.4,1)}
.lane .sc{text-align:right}.lane .sc b{font:700 2vw Mali;display:block;line-height:1.1}
.lane .sc small{font-size:1vw;font-weight:600;color:#776}
.lane:first-child{background:#fff1c9}
.legend{font-size:1.2vw;font-weight:600;color:#665}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:1.6vw;flex:1}
.pod>div{width:19vw;display:flex;flex-direction:column;align-items:center}
.pod .nm{font:700 2vw Mali;margin-top:.2vw}.pod .sc{font-size:1.2vw;font-weight:700;margin-bottom:.5vw;color:#665;text-align:center}
.pod .st{width:100%;border:.2vw solid var(--ink);border-bottom:none;border-radius:1.4vw 1.4vw 0 0;display:flex;justify-content:center;padding-top:.6vw;font:700 3.6vw Mali;color:#fff}
#conf{position:fixed;inset:0;pointer-events:none;z-index:15}
.err{color:#d00;font-size:1.2vw;min-height:1.5vw;font-weight:600}
</style></head><body class="paws strollon">

<section class="scr on" id="sLogin">
 <div class="parade" id="parade"></div>
 <div class="mali" style="font-size:1.5vw" id="course"></div>
 <h1 style="font-size:3vw;max-width:72vw;line-height:1.35" id="title"></h1>
 <div class="card" style="display:flex;gap:1vw;align-items:center;padding:1.2vw 2vw;margin-top:.6vw">
  <input id="code" type="password" inputmode="numeric" placeholder="รหัสครู">
  <button class="btn" onclick="login()">สร้างห้องเกม</button>
 </div>
 <div class="err" id="lerr"></div>
</section>

<section class="scr" id="sLobby">
 <div class="top"><img src="../emblem.png" alt=""><span class="chip" id="lobTitle"></span><span class="sp"></span><button class="btn s mu" onclick="mute()">ปิดเสียง</button></div>
 <div class="lob">
  <div class="card join">
   <div><small>เข้าเว็บ</small><div class="url" id="url"></div><small>รหัสเกม</small><div class="pin" id="pin"></div></div>
   <div id="qr"></div>
  </div>
  <div class="card lobinfo">
   <h2 id="lobH"></h2>
   <div style="display:flex;align-items:flex-end;justify-content:space-between">
    <div class="cnt"><span id="pc">0</span> <small>คนเข้าเกมแล้ว</small></div>
    <button class="btn" onclick="startGame()">เริ่มเกม</button>
   </div>
  </div>
 </div>
 <div class="stage" id="stage"><div class="rug"></div><div class="empty" id="empty">สแกน QR แล้วเลือกแมวของตัวเอง แมวจะมาเดินเล่นตรงนี้</div></div>
</section>

<section class="scr" id="sPart">
 <div class="pno" id="pNo"></div>
 <h1 id="pTitle"></h1>
 <div class="mali" style="font-size:1.8vw" id="pSub"></div>
 <div class="parade" id="pCats" style="margin-top:1vw"></div>
 <button class="btn" style="margin-top:1vw" onclick="partGo()">เริ่ม</button>
</section>

<section class="scr" id="sQ">
 <div class="top"><img src="../emblem.png" alt=""><span class="chip" id="qRound"></span><span class="chip alt" id="qNo"></span><span class="sp"></span><button class="btn s mu" onclick="mute()">ปิดเสียง</button><button class="btn s" onclick="doReveal()">เฉลยเลย</button></div>
 <div class="card qcard" id="qText"></div>
 <div class="tbar"><div class="track"><i id="tbar"></i></div><div class="tnum" id="tm"></div></div>
 <div class="qbody" id="qBody"></div>
 <div class="sent"><div class="lbl">ส่งแล้ว <span id="an">0</span>/<span id="ap">0</span></div><div class="row" id="sentRow"></div></div>
</section>

<section class="scr" id="sR">
 <div class="top"><img src="../emblem.png" alt=""><span class="chip" id="rRound"></span><span class="sp"></span><button class="btn s mu" onclick="mute()">ปิดเสียง</button></div>
 <div class="card qcard" id="rText" style="font-size:1.9vw;padding:.9vw 2vw;margin:.9vw 0"></div>
 <div class="rgrid"><div id="rMain"></div><div id="rSide"></div></div>
 <div id="rBottom"></div>
 <div class="foot"><button class="btn y" id="talkBtn" onclick="talk(true)">คำถามต่อ</button><button class="btn" id="nextBtn" onclick="nextStep()">ถัดไป</button></div>
</section>

<section class="scr" id="sSum">
 <div class="top"><img src="../emblem.png" alt=""><span class="chip" id="sTitle"></span></div>
 <h1 style="font-size:3vw;margin-top:1vw">สรุปพาร์ทนี้</h1>
 <div class="sumwrap"><div class="sumlist" id="sList"></div><div style="text-align:center" id="sCat"></div></div>
 <div class="foot"><button class="btn" onclick="board()">ดูคะแนนรวม</button></div>
</section>

<section class="scr" id="sB">
 <div class="top"><img src="../emblem.png" alt=""><span class="chip">คะแนนรวม</span><span class="sp"></span><span class="legend">คะแนน = ความถูก + ความเร็ว</span></div>
 <div class="lanes" id="lanes"></div>
 <div class="foot"><button class="btn" id="bNext" onclick="afterBoard()">ไปพาร์ทถัดไป</button></div>
</section>

<section class="scr" id="sEnd">
 <div class="top"><img src="../emblem.png" alt=""><span class="chip">จบเกม</span><span class="sp"></span><button class="btn s mu" onclick="mute()">ปิดเสียง</button></div>
 <h1 style="text-align:center;font-size:3.2vw;margin-top:.5vw">อันดับสุดท้าย</h1>
 <div class="pod" id="pod"></div>
 <div class="foot" style="justify-content:center"><button class="btn y" onclick="openReport()">ดูรายงานผล</button></div>
</section>

<div class="talkpop" id="talkPop" onclick="talk(false)"><div class="card"><h3>ครูถามต่อ</h3><p id="talkTxt"></p><div id="talkCat"></div></div></div>
<canvas id="conf"></canvas>

<script src="common.js"></script><script src="data.js"></script>
<script>
const D = window.K3, P = D.parts; let code = "", pin = "", qi = -1, pi = 0, ii = 0, players = [], tStart = 0, tLeft = -1, tIv, poll, revealed = false, lastBoard = {};
const $ = id => document.getElementById(id);
$("course").textContent = D.course; $("title").textContent = D.title; $("lobTitle").textContent = D.course; $("lobH").textContent = D.title;
const parade = (sz) => [0,1,2,3,4,5,6,7].map(i => `<span style="display:inline-block;animation:k3bob 1.4s ${i * .15}s ease-in-out infinite">${avEl(i, "", i % 3 ? "normal" : "happy", sz)}</span>`).join("");
$("parade").innerHTML = parade("6vw");
addStrollers(2, "5vw");
const show = id => { document.querySelectorAll(".scr").forEach(s => s.classList.toggle("on", s.id === id)); document.body.classList.toggle("strollon", ["sLogin", "sPart", "sSum", "sEnd"].includes(id)); };
function mute() { const m = Music.toggle(); document.querySelectorAll(".mu").forEach(x => x.textContent = m ? "เปิดเสียง" : "ปิดเสียง"); }
const T = (a, q) => rpc("k3_teacher", { p_code: code, p_action: a, p_qi: q == null ? null : q });

async function login() {
  code = $("code").value.trim();
  try {
    pin = await rpc("k3_teacher", { p_code: code, p_action: "new" });
    sessionStorage.setItem("k3_code", code);
    const base = location.pathname.replace(/host(\.html)?$/, "");
    $("url").textContent = (location.host + base).replace(/\/$/, "");
    $("pin").textContent = pin;
    const q = qrcode(0, "M"); q.addData(location.origin + base + "?pin=" + pin); q.make();
    $("qr").innerHTML = q.createImgTag(6, 0);
    show("sLobby"); Music.play("lobby");
    clearInterval(poll); poll = setInterval(lobbyPoll, 1500); lobbyPoll(); setTimeout(wander, 2000);
  } catch (e) { $("lerr").textContent = e.message.includes("BADCODE") ? "รหัสครูไม่ถูกต้อง" : "เชื่อมต่อไม่ได้ " + e.message; }
}
const walkers = {};
async function lobbyPoll() {
  players = await getPlayers(pin);
  $("pc").textContent = players.length; $("empty").style.display = players.length ? "none" : "flex";
  players.forEach(p => {
    if (walkers[p.id]) return;
    const w = document.createElement("div"); w.className = "walker";
    w.innerHTML = avEl(p.avatar, "pop", "happy", "5vw") + `<span class="tag">${esc(p.name)}</span>`;
    const top = 22 + Math.random() * 46;
    w.style.left = (4 + Math.random() * 86) + "%"; w.style.top = top + "%"; w.style.zIndex = Math.round(top);
    $("stage").appendChild(w); walkers[p.id] = w; Music.meow(0.85 + Math.random() * 0.4);
    setTimeout(() => w.querySelector(".av").className = "av bob", 600);
  });
}
function wander() {
  if (!$("sLobby").classList.contains("on")) return;
  Object.values(walkers).forEach(w => {
    if (Math.random() < .45) return;
    const av = w.querySelector(".av"), from = parseFloat(w.style.left), to = Math.max(3, Math.min(90, from + (Math.random() * 30 - 15)));
    av.className = "av walk"; av.style.transform = to < from ? "scaleX(-1)" : "";
    w.style.left = to + "%"; setTimeout(() => { av.className = "av bob"; av.style.transform = ""; }, 3000);
  });
  setTimeout(wander, 3600);
}
function startGame() { clearInterval(poll); showPart(0); }

async function showPart(i) {
  pi = i; ii = 0; const p = P[i];
  await T("intro");
  $("pNo").textContent = i === 0 ? "ก่อนเริ่ม" : "พาร์ท " + i + " จาก " + (P.length - 1);
  $("pTitle").textContent = p.title.replace(/^พาร์ท \d+ /, "");
  $("pSub").textContent = p.sub;
  $("pCats").innerHTML = parade("5vw");
  p.items.forEach(q => { const Q = D.Q[q]; [Q.sil, Q.img].forEach(u => { if (u) { const im = new Image(); im.src = u; } }); });
  show("sPart"); Music.play("p" + p.music); Music.meow(1.1);
}
function partGo() { goQ(P[pi].items[0]); }

function optCards(Q) { return '<div class="opts">' + Q.opts.map((t, k) => `<div class="opt"><span class="let" style="background:${COLORS[k]}">${LETTERS[k]}</span><span>${esc(t)}</span></div>`).join("") + "</div>"; }
const sentIds = new Set();
async function goQ(i) {
  qi = i; revealed = false; const Q = D.Q[i];
  await T("question", i);
  players = await getPlayers(pin);
  $("qRound").textContent = P[pi].title;
  $("qNo").textContent = (Q.cat ? Q.cat + " " : "") + "ข้อ " + (ii + 1) + "/" + P[pi].items.length + (Q.kind === "poll" ? " โพล ไม่คิดคะแนน" : Q.kind === "type" ? " พิมพ์คำตอบ" : "") + (Q.dbl ? " คะแนนสองเท่า" : "");
  $("qText").innerHTML = esc(Q.q).replace("______", '<span class="blank">&nbsp;</span>');
  const b = $("qBody"); b.className = "qbody" + (Q.sil ? " img" : "");
  b.innerHTML = Q.kind === "type" ? `<div class="card typebox">${avEl(0, "bob", "happy", "5vw")}<span>พิมพ์คำที่หายไปในมือถือ สะกดให้ถูก ยิ่งเร็วยิ่งได้คะแนนมาก</span></div>`
    : (Q.sil ? `<div class="card qimg"><img src="${Q.sil}" alt=""></div>` : "") + optCards(Q);
  $("an").textContent = 0; $("ap").textContent = players.length; $("sentRow").innerHTML = ""; sentIds.clear();
  show("sQ"); Music.play("p" + P[pi].music);
  tStart = Date.now(); tLeft = -1; tick();
  clearInterval(tIv); tIv = setInterval(tick, 200);
  clearInterval(poll); poll = setInterval(qPoll, 1200);
}
function tick() {
  const TT = D.Q[qi].t, el = (Date.now() - tStart) / 1000, left = Math.max(0, Math.ceil(TT - el));
  const b = $("tbar"); b.style.width = Math.max(0, 100 - el / TT * 100) + "%"; b.style.background = left <= 5 ? "var(--c0)" : "var(--c1)";
  if (left !== tLeft) { tLeft = left; $("tm").textContent = left; if (left <= 5 && left > 0) Music.tick(); }
  if (el >= TT) doReveal();
}
async function qPoll() {
  const list = await rpc("k3_answered", { p_pin: pin, p_qi: qi });
  $("an").textContent = list.length;
  list.forEach(p => { if (sentIds.has(p.id)) return; sentIds.add(p.id); $("sentRow").insertAdjacentHTML("beforeend", avEl(p.avatar, "pop", "normal", "3.6vw")); });
  if (players.length && list.length >= players.length) doReveal();
}
async function doReveal() {
  if (revealed) return; revealed = true;
  clearInterval(tIv); clearInterval(poll);
  await T("reveal");
  const Q = D.Q[qi], s = await rpc("k3_stats", { p_pin: pin, p_qi: qi });
  Music.stop(); Music.sting(true);
  $("rRound").textContent = P[pi].title;
  $("rText").innerHTML = esc(Q.q).replace("______", '<span class="blank">' + (Q.kind === "type" ? esc(Q.ans) : "&nbsp;") + "</span>");
  let main = "", side = "";
  const hasAns = Q.kind === "choice" || Q.kind === "practice";
  if (Q.kind === "type") {
    main = `<div class="card answord"><small>คำตอบ</small><b>${esc(Q.ans)}</b><small>ตอบถูก ${s.right} จาก ${s.n} คน</small><div class="words">` +
      s.texts.slice(0, 12).map(w => `<span class="${w.ok ? "y" : ""}">${esc(w.t)} ${w.c}</span>`).join("") + "</div></div>";
  } else {
    const mx = Math.max(1, ...Q.opts.map((_, k) => s.counts[k] || 0));
    main = '<div class="rows">' + Q.opts.map((t, k) => {
      const v = s.counts[k] || 0, ok = hasAns && k === Q.ans, dim = hasAns && !ok;
      return `<div class="rrow ${ok ? "ok" : ""} ${dim ? "dim" : ""}"><span class="let" style="background:${COLORS[k]};width:3vw;height:3vw;font-size:1.6vw">${LETTERS[k]}</span><span class="txt">${esc(t)}</span><span class="bw"><i data-w="${v / mx * 100}" style="background:${COLORS[k]}"></i></span><span class="n">${v}</span>${ok ? '<span class="mark">ถูก</span>' : ""}</div>`;
    }).join("") + "</div>";
    if (Q.sil) { main = `<div style="display:grid;grid-template-columns:24vw 1fr;gap:1.4vw;align-items:center"><div class="card qimg flip"><img class="s" src="${Q.sil}" alt=""><img class="r" src="${Q.img}" alt=""></div>${main}</div>`; setTimeout(() => { Music.sting(true); Music.meow(1.3); }, 950); }
  }
  if (Q.kind !== "poll") {
    side = s.fast ? `<div class="card fast"><h3>ตอบถูกเร็วที่สุด</h3>${avEl(s.fast.avatar, "jump", "happy", "7vw")}<div class="nm">${esc(s.fast.name)}</div><div class="sec">${s.fast.sec} วินาที</div></div>`
      : `<div class="card fast"><h3>ข้อนี้ยังไม่มีคนตอบถูก</h3>${avEl(1, "sad", "sad", "6vw")}</div>`;
  } else side = `<div class="card fast"><h3>ตอบโพลแล้ว</h3>${avEl(2, "bob", "happy", "6vw")}<div class="nm" style="font-size:3vw">${s.n} คน</div></div>`;
  $("rMain").innerHTML = main; $("rSide").innerHTML = side;
  $("rBottom").innerHTML = Q.exp ? `<div class="card exp"><b>สรุป</b> ${esc(Q.exp)}${Q.src ? `<div class="src">ที่มา: ${esc(Q.src)}</div>` : ""}</div>` : "";
  setTimeout(() => document.querySelectorAll(".rrow .bw i").forEach(i => i.style.width = i.dataset.w + "%"), 60);
  $("talkBtn").style.display = Q.talk ? "" : "none";
  const lastInPart = ii === P[pi].items.length - 1;
  $("nextBtn").textContent = !lastInPart ? "ข้อถัดไป" : P[pi].summary ? "สรุปพาร์ท" : "ไปพาร์ทถัดไป";
  show("sR");
}
function talk(on) {
  const Q = D.Q[qi];
  if (on && Q.talk) { $("talkTxt").textContent = Q.talk; $("talkCat").innerHTML = avEl(qi % 8, "bob", "normal", "6vw"); Music.meow(1); }
  $("talkPop").classList.toggle("on", !!on);
}
function nextStep() {
  if (ii < P[pi].items.length - 1) { ii++; return goQ(P[pi].items[ii]); }
  if (P[pi].summary) return showSum();
  return pi < P.length - 1 ? showPart(pi + 1) : finish();
}
async function showSum() {
  await T("summary");
  $("sTitle").textContent = P[pi].title;
  $("sList").innerHTML = P[pi].summary.map((t, k) => `<div class="card"><span class="no">${k + 1}</span><span>${esc(t)}</span></div>`).join("");
  $("sCat").innerHTML = avEl(pi % 8, "bob", "happy", "15vw");
  show("sSum"); Music.play("lobby");
}
async function board() {
  await T("board");
  players = await getPlayers(pin);
  const top = players.slice(0, 5), mx = Math.max(1, players[0] ? players[0].score : 1);
  $("lanes").innerHTML = top.map((p, i) => `<div class="lane" style="animation-delay:${i * .08}s"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}</span><div class="rt"><div class="runner" id="run${i}" style="left:${lastBoard[p.id] || 0}%">${avEl(p.avatar, "walk", "happy", "4.8vw")}</div></div><div class="sc"><b>${p.score}</b><small>ถูก ${p.score_ok} เร็ว ${p.score_speed}</small></div></div>`).join("");
  $("bNext").textContent = pi < P.length - 1 ? "ไปพาร์ทถัดไป" : "ประกาศผล";
  show("sB");
  setTimeout(() => top.forEach((p, i) => { const pos = p.score / mx * 86; lastBoard[p.id] = pos; $("run" + i).style.left = pos + "%"; }), 300);
  setTimeout(() => document.querySelectorAll(".runner .av").forEach(a => a.className = "av bob"), 2400);
}
function afterBoard() { return pi < P.length - 1 ? showPart(pi + 1) : finish(); }
async function finish() {
  await T("end");
  players = await getPlayers(pin);
  const p = players, ord = [1, 0, 2], hts = { 0: 14, 1: 9.5, 2: 6.5 }, cols = { 0: "var(--c2)", 1: "var(--c3)", 2: "var(--c0)" };
  $("pod").innerHTML = ord.map(i => p[i] ? `<div>${avEl(p[i].avatar, "jump", "happy", i === 0 ? "9vw" : "7vw")}<div class="nm">${esc(p[i].name)}</div><div class="sc">${p[i].score} คะแนน<br>ถูก ${p[i].score_ok} เร็ว ${p[i].score_speed}</div><div class="st" style="height:${hts[i]}vw;background:${cols[i]}">${i + 1}</div></div>` : "").join("");
  show("sEnd"); Music.stop(); Music.fanfare(); setTimeout(() => Music.meow(1.2), 900); confetti();
}
function openReport() { window.open("report.html?pin=" + pin, "_blank"); }
function confetti() {
  const c = $("conf"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const P2 = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -Math.random() * c.height, w: 6 + Math.random() * 8, h: 10 + Math.random() * 10, v: 2 + Math.random() * 3, r: Math.random() * 6, s: Math.random() * .2 - .1, col: ["#ff7a8a", "#3cb6a0", "#ffa94d", "#8a7dff", "#2b2540"][Math.random() * 5 | 0] }));
  let n = 0; (function f() { x.clearRect(0, 0, c.width, c.height); P2.forEach(p => { p.y += p.v; p.x += Math.sin(p.y / 40); p.r += p.s; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.col; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); }); if (++n < 600) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height); })();
}
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && $("sLogin").classList.contains("on")) return login();
  if (e.key === "Escape") return talk(false);
  if (e.key === "ArrowRight") {
    if ($("talkPop").classList.contains("on")) return talk(false);
    if ($("sQ").classList.contains("on")) doReveal();
    else if ($("sR").classList.contains("on")) nextStep();
    else if ($("sPart").classList.contains("on")) partGo();
    else if ($("sSum").classList.contains("on")) board();
    else if ($("sB").classList.contains("on")) afterBoard();
  }
});
</script>
</body></html>
