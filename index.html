<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจข่าวก่อนแชร์ | ส33265</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="mock.css">
<script src="common.js"></script>
<style>
:root{--bg:#F5F3FF;--ink:#1E1B4B;--ink2:#3F3F5F;--mute:#6B7280;--line:#E5E7EB;--card:#fff;--acc:#6D28D9;--acc2:#5B21B6;--g1:linear-gradient(135deg,#7C3AED 0%,#DB2777 100%);--g2:linear-gradient(135deg,#06B6D4,#3B82F6);--ok:#16A34A;--bad:#DC2626;--warn:#D97706;--navy:#1C3652}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif;font-size:16px}
h1,h2,h3,.hd,button,.btn{font-family:'Anuphan',sans-serif}
.app{max-width:600px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;background:rgba(244,245,247,.9);backdrop-filter:blur(12px);margin:0 -16px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.topbar .t{font-family:'Anuphan';font-weight:700;font-size:18px;letter-spacing:-.2px;background:var(--g1);-webkit-background-clip:text;background-clip:text;color:transparent}
.topbar .s{font-size:12px;color:var(--mute)}
.who{font-size:13px;color:var(--ink2);text-align:right}
.back{background:none;border:0;color:var(--acc);font-size:15px;padding:12px 0 4px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:12px 0}
h2{font-size:22px;margin:4px 0 6px;letter-spacing:-.3px}h3{font-size:17px;margin:16px 0 8px}
p{line-height:1.65;margin:6px 0;color:var(--ink2)}
.mute{color:var(--mute);font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:600;background:var(--ink);color:#fff;cursor:pointer;margin-top:12px;text-align:center}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.35}
.btn.acc{background:var(--g1);box-shadow:0 8px 20px -8px rgba(219,39,119,.6)}.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .btn{margin-top:0}
label.f{display:block;font-family:'Anuphan';font-weight:600;font-size:15px;margin:14px 0 6px}
.sec{border:2px solid #E9D5FF;border-radius:16px;margin:16px 0;overflow:hidden;background:#fff}
.sec>h3{margin:0;padding:11px 14px;background:linear-gradient(90deg,#F3E8FF,#FCE7F3);color:#6D28D9;font-size:17px;border-bottom:1px solid #E9D5FF}
.sec>.sbody{padding:2px 14px 14px}
.qbox{border:1px solid #E2E8F0;border-left:5px solid #A855F7;border-radius:12px;padding:12px;margin:12px 0;background:#FCFAFF}
.qbox>label.f:first-child{margin-top:0}
.hint{font-size:13px;color:var(--mute);margin:-2px 0 6px;line-height:1.5}
input[type=text],textarea,select{width:100%;border:1px solid #CBD5E1;border-radius:12px;padding:12px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none}
input[type=text]:focus,textarea:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.count{font-size:12px;color:var(--mute);text-align:right;margin-top:2px}
/* home */
.hero{padding:22px 20px;margin-top:14px;border-radius:22px;background:var(--g1);color:#fff;box-shadow:0 14px 30px -14px rgba(124,58,237,.7)}.hero h1{font-size:28px;margin:0;letter-spacing:-.5px}.hero p,.hero .mute{margin:4px 0 0;color:rgba(255,255,255,.88)}.hero .bar{background:rgba(255,255,255,.3)}.hero .bar i{background:#fff}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:14px 0 4px}.bar i{display:block;height:100%;background:var(--g1);transition:width .4s}
.act{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;cursor:pointer}
.act .n{width:42px;height:42px;border-radius:13px;background:var(--c,#7C3AED);color:#fff;display:grid;place-items:center;font-family:'Anuphan';font-weight:700;font-size:18px;flex:none}
.act.done{border-color:#BBF7D0}.act{border-left:5px solid var(--c,#7C3AED)}
.act .m{flex:1}.act .m b{display:block;font-family:'Anuphan';font-size:16px}.act .m span{font-size:13px;color:var(--mute)}
.act .r{font-size:13px;color:var(--mute);text-align:right;white-space:nowrap}.act.done .r{color:var(--ok);font-weight:600}
.pill{display:inline-block;font-size:12px;font-family:'Anuphan';font-weight:600;padding:4px 12px;border-radius:999px;background:var(--g1);color:#fff}
/* options */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid #CBD5E1;background:#fff;border-radius:999px;padding:9px 14px;font-size:15px;cursor:pointer;user-select:none;font-family:'Anuphan'}
.opt.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.opt.hit{background:#DCFCE7;border-color:var(--ok);color:#14532D}.opt.wrong{background:#FEE2E2;border-color:var(--bad);color:#7F1D1D}.opt.missed{border-style:dashed;color:var(--warn);border-color:var(--warn)}
/* game */
.ghead{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}
.timer{font-family:'Anuphan';font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--g2);color:#fff;min-width:64px;text-align:center}
.timer.low{background:var(--bad)}
.vote{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.vote button{border:0;border-radius:14px;padding:16px;font-size:19px;font-weight:700;cursor:pointer}
.vt{background:var(--g2);color:#fff}.vf{background:linear-gradient(135deg,#F97316,#E11D48);color:#fff}
.vote button:disabled{opacity:.4}
.fb{border-radius:14px;padding:14px;margin-top:12px}
.fb.ok{background:#F0FDF4;border:1px solid #BBF7D0}.fb.no{background:#FEF2F2;border:1px solid #FECACA}
.fb b.h{font-family:'Anuphan';font-size:17px}
.tag{display:inline-block;font-size:13px;padding:4px 10px;border-radius:999px;background:#FEF3C7;color:#78350F;margin:6px 6px 0 0;font-family:'Anuphan'}
.tag.g{background:#E0F2FE;color:#0C4A6E}
.note{font-size:13px;color:var(--mute);background:#F8FAFC;border:1px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;line-height:1.55}
/* mocks */
.hardl{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}.hardl .opt.on b{color:#fff!important}.hardl .opt{display:block;text-align:left;border-radius:12px;line-height:1.45}
/* steps */
.step{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#fff}
.step .sh{display:flex;gap:10px;align-items:center;font-family:'Anuphan';font-weight:700}
.step .sh i{font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--g1);color:#fff;display:grid;place-items:center;font-size:14px}
.step .how{font-size:14px;color:var(--ink2);margin:8px 0;line-height:1.6}
.step a{color:var(--acc);font-size:14px;display:inline-block;margin:0 10px 6px 0}
.facts{font-size:14px;line-height:1.7;color:var(--ink2);background:#F8FAFC;border-radius:12px;padding:10px 12px;margin-top:10px}
.facts b{color:var(--ink)}
.score{font-family:'Anuphan';font-weight:700;font-size:56px;text-align:center;letter-spacing:-1px;margin:6px 0}
.rub{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;line-height:1.55}
.rub.ok{border-color:#BBF7D0;background:#F0FDF4}.rub.no{border-color:#FECACA;background:#FEF2F2}
.rub b{font-family:'Anuphan'}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:30;padding:20px}
.modal .card{max-width:420px;width:100%}
#ws{position:fixed;left:-99999px;top:0}
.wsimg{width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px}
#pauseOv{position:fixed;inset:0;z-index:50;display:grid;place-items:center;text-align:center;color:#fff;background:linear-gradient(135deg,#7C3AED,#DB2777);font-family:'Anuphan';padding:30px;animation:in .3s}
#tbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:40;display:flex;gap:12px;align-items:center;background:#1E1B4B;color:#fff;border-radius:999px;padding:8px 18px;font-family:'Anuphan';box-shadow:0 10px 24px -10px rgba(30,27,75,.6)}
#tbar b{font-size:20px;font-variant-numeric:tabular-nums}#tbar.low{background:#DC2626;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.05)}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><div><div class="t">ตรวจข่าวก่อนแชร์</div><div class="s">ส33265 เหตุการณ์ปัจจุบัน 2 สัปดาห์ที่ 1</div></div><div class="who" id="who"></div></div>
  <div id="v"></div>
</div>
<div id="ws"></div>
<div class="toast" id="toast"></div>
<script>
const SHOWQ=new URLSearchParams(location.search).get('show');
/* ---------- state ---------- */
let S;try{S=JSON.parse(localStorage.getItem('ckn1')||'null')}catch(e){}
if(!S)S={me:null,cid:(crypto.randomUUID?crypto.randomUUID():String(Math.random()).slice(2)+Date.now()),a1:null,a2:null,a3:null,a4:null,a5:null,a6:null};
const save=()=>{try{localStorage.setItem('ckn1',JSON.stringify(S))}catch(e){}report()};
let RPT;function report(){clearTimeout(RPT);RPT=setTimeout(()=>{if(!S.me||typeof rpc!=='function')return;const d=Object.assign({},S);delete d.cid;rpc('news_report_progress2',{p_client:S.cid,p_name:S.me.name,p_cls:S.me.cls,p_no:S.me.no,p_done:ACTS.filter(a=>S[a.k]).map(a=>a.k),p_current:S.cur||null,p_score:totalSt(S),p_data:d}).then(applyState).catch(()=>{})},800)}
let CS={pause:false,timer_end:null,skew:0};
function applyState(r){if(!r)return;if(r.reset){try{localStorage.removeItem('ckn1')}catch(e){}document.body.innerHTML='<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;font-family:Anuphan"><div><h2>ครูให้เริ่มทำใหม่</h2><p>คำตอบเดิมถูกลบแล้ว</p><button class="btn acc" onclick="location.reload()">เริ่มใหม่</button></div></div>';return}CS.pause=!!r.pause;CS.timer_end=r.timer_end?new Date(r.timer_end).getTime():null;CS.label=r.timer_label||'';CS.skew=Date.now()-new Date(r.now).getTime();drawState()}
function drawState(){
 let p=$('#pauseOv');if(CS.pause){if(!p){p=document.createElement('div');p.id='pauseOv';p.innerHTML='<div><div style="font-size:15px;opacity:.85;letter-spacing:2px">ครูขอเวลาสักครู่</div><div style="font-size:44px;font-weight:700;margin:10px 0">มองหน้าจอครู</div><div style="font-size:16px;opacity:.85">วางมือถือไว้ก่อน คำตอบยังอยู่ครบ</div></div>';document.body.appendChild(p)}}else if(p)p.remove();
 let t=$('#tbar');if(CS.timer_end){if(!t){t=document.createElement('div');t.id='tbar';document.body.appendChild(t)}const left=Math.round((CS.timer_end-(Date.now()-CS.skew))/1000);t.className=left<=60?'low':'';t.innerHTML=left>0?`<span>${esc(CS.label||'เวลาที่เหลือ')}</span><b>${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b>`:`<span>${esc(CS.label||'')}</span><b>หมดเวลา</b>`}else if(t)t.remove();
}
setInterval(drawState,1000);
setInterval(()=>{if(!SHOWQ&&document.visibilityState==='visible'&&typeof rpc==='function')rpc('news_class_state',{}).then(applyState).catch(()=>{})},5000);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function view(h){$('#v').innerHTML=h;$$('#v .card').forEach(boxify);scrollTo(0,0)}
function boxify(c){
 if(!c.querySelector(':scope>h3,:scope>label.f'))return;
 const kids=[...c.children];let sb=null,q=null;
 for(const el of kids){
  if(el.tagName==='H3'){const sec=document.createElement('div');sec.className='sec';c.insertBefore(sec,el);sec.appendChild(el);sb=document.createElement('div');sb.className='sbody';sec.appendChild(sb);q=null;continue}
  if(el.matches('.btn,.secend')){sb=null;q=null;continue}
  if(el.matches('label.f')&&!el.classList.contains('sub')){q=document.createElement('div');q.className='qbox';if(sb)sb.appendChild(q);else c.insertBefore(q,el);q.appendChild(el);continue}
  if(q)q.appendChild(el);else if(sb)sb.appendChild(el);
 }
}
const back=()=>`<button class="back" onclick="home()">‹ กลับหน้ารวมกิจกรรม</button>`;
function confirmBox(msg,ok){const d=document.createElement('div');d.className='modal';d.innerHTML=`<div class="card"><p style="color:var(--ink)">${msg}</p><div class="row2"><button class="btn ghost" id="cn">ยกเลิก</button><button class="btn" id="cy">ยืนยัน</button></div></div>`;document.body.appendChild(d);d.querySelector('#cn').onclick=()=>d.remove();d.querySelector('#cy').onclick=()=>{d.remove();ok()}}
function optsHTML(id,map,sel,multi){return `<div class="opts" id="${id}">${Object.entries(map).map(([k,v])=>`<span class="opt ${(multi?(sel||[]).includes(k):sel===k)?'on':''}" data-k="${k}" onclick="${multi?"this.classList.toggle('on')":`pickOne('${id}',this)`}">${v}</span>`).join('')}</div>`}
function pickOne(id,el){$$('#'+id+' .opt').forEach(o=>o.classList.remove('on'));el.classList.add('on')}
const picked=id=>$$('#'+id+' .opt.on').map(o=>o.dataset.k);
function counter(id,max){const e=$('#'+id);const c=document.createElement('div');c.className='count';e.after(c);const u=()=>c.textContent=e.value.length+'/'+max;e.maxLength=max;e.addEventListener('input',u);u()}
/* ---------- mocks ---------- */
/* ---------- start ---------- */
const scoreOf=k=>S[k]?S[k].score:0;
function setWho(){$('#who').innerHTML=S.me?(S.me.p?S.me.p.map(x=>`${esc(x.name.split(' ')[0].replace(/^(นาย|นางสาว|นาง|เด็กชาย|เด็กหญิง)/,''))} (${esc(x.no)})`).join('<br>'):esc(S.me.name)):''}
function start(){
 const P=(i)=>`<div class="step"><div class="sh"><i>${i}</i>นักเรียนคนที่ ${i}${i===2?' <span class="mute" style="font-weight:400">(ไม่มีคู่ เว้นว่างได้)</span>':''}</div><label class="f">ชื่อ-สกุล</label><input type="text" id="nm${i}" placeholder="เช่น นายสมชาย ใจดี" maxlength="60"><label class="f">เลขที่</label><input type="text" id="no${i}" inputmode="numeric" maxlength="3" placeholder="เช่น 12"></div>`;
 view(`<div class="hero"><h1>เริ่มต้น</h1><p>ทำเป็นคู่ ใช้มือถือเครื่องเดียว กรอกชื่อทั้ง 2 คน ถ้าไม่มีคู่ทำคนเดียวได้ ข้อมูลนี้จะอยู่บนใบงานที่ส่งครู</p></div>
 <div class="card"><label class="f">ชั้น</label><select id="cl"><option>ม.6/17</option></select>${P(1)}${P(2)}
 <button class="btn acc" onclick="doStart()">เริ่มกิจกรรม</button>
 <p class="mute" style="margin-top:12px">คำตอบเก็บไว้ในมือถือเครื่องนี้ และส่งถึงครูเมื่อสร้างใบงานในกิจกรรมที่ 6</p></div>`);
}
function doStart(){
 const c=$('#cl').value;let p=[1,2].map(i=>({name:$('#nm'+i).value.trim(),no:$('#no'+i).value.trim()}));
 if(!p[1].name&&!p[1].no)p=[p[0]];
 if(p.some(x=>x.name.length<4||!x.no)){toast('กรอกชื่อ-สกุลและเลขที่ให้ครบ');return}
 if(p.length===2&&p[0].no===p[1].no){toast('เลขที่ของ 2 คนซ้ำกัน');return}
 p.sort((a,b)=>(+a.no||0)-(+b.no||0));
 const me={p,cls:c,name:p.map(x=>x.name).join(' และ '),no:p.map(x=>x.no).join(', ')};
 const go1=()=>{S.me=me;save();setWho();home()};
 if(S.a1||typeof rpc!=='function')return go1();
 rpc('news_find_progress',{p_cls:c,p_nos:p.map(x=>x.no)}).then(R=>{
  R=(R||[]).filter(r=>r.client_id!==S.cid&&r.done&&r.done.length);if(!R.length)return go1();
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div class="card" style="max-height:90vh;overflow:auto"><h3 style="margin-top:0">พบงานที่เคยทำไว้</h3><p class="mute">ถ้าเป็นงานของเรา กดทำต่อ คำตอบเดิมจะกลับมา</p>
  ${R.map((r,i)=>`<div class="qbox"><b>${esc(r.name)}</b><div class="mute">เลขที่ ${esc(r.no)} ทำแล้ว ${r.done.length} กิจกรรม ล่าสุด ${new Date(r.updated_at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</div><button class="btn acc" data-i="${i}">ทำต่อจากงานนี้</button></div>`).join('')}
  <button class="btn ghost" id="nw">ไม่ใช่ เริ่มใหม่</button></div>`;
  document.body.appendChild(m);
  m.querySelector('#nw').onclick=()=>{m.remove();go1()};
  m.querySelectorAll('[data-i]').forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent='กำลังดึงงาน…';
   try{const d=await rpc('news_resume_progress',{p_client:R[+b.dataset.i].client_id});if(!d)throw 0;
    S=Object.assign({a1:null,a2:null,a3:null,a4:null,a5:null,a6:null},d,{cid:R[+b.dataset.i].client_id,me:d.me||me});m.remove();save();setWho();home();toast('ดึงงานเดิมกลับมาแล้ว')}
   catch(e){b.disabled=false;b.textContent='ทำต่อจากงานนี้';toast('ดึงงานไม่สำเร็จ ลองอีกครั้ง')}});
 }).catch(go1);
}
function home(){
 if(!S.me)return start();
 const done=ACTS.filter(a=>S[a.k]).length,sc=ACTS.reduce((s,a)=>s+scoreOf(a.k),0);
 view(`<div class="hero"><h1>กิจกรรมวันนี้</h1><p>ทำตามลำดับ 1–6 ภายใน 50 นาที</p><div class="bar"><i style="width:${done/6*100}%"></i></div><div class="mute">ทำแล้ว ${done}/6 คะแนน ${sc}/${TOTAL}</div></div>
 ${ACTS.map((a,i)=>`<div class="act ${S[a.k]?'done':''}" style="--c:${['#7C3AED','#DB2777','#F59E0B','#10B981','#06B6D4','#6366F1'][i]}" onclick="go(${i+1})"><div class="n">${i+1}</div><div class="m"><b>${a.t}</b><span>${a.d}</span></div><div class="r">${S[a.k]?`${S[a.k].score}/${a.max}`:a.min+' นาที'}</div></div>`).join('')}
 <button class="btn ghost" style="margin-top:20px" onclick="confirmBox('ล้างคำตอบทั้งหมดในเครื่องนี้และเริ่มใหม่?',()=>{localStorage.removeItem('ckn1');location.reload()})">ล้างข้อมูลและเริ่มใหม่</button>`);
}
function go(n){S.cur=n;save();[a1,a2,a3,a4,a5,a6][n-1]()}
/* ---------- 1 game ---------- */
const T=25;let G;
function a1(){
 if(S.a1)return a1Result();

}
async function a4Send(){
 const sg=picked('gs'),ty=picked('gt')[0];if(!sg.length||!ty){toast('เลือกสัญญาณเตือนและประเภท');return}
 $('#ck').disabled=true;
 try{const r=await rpc('news_check_answer',{p_post:S.a4.cur.id,p_client:S.cid,p_signals:sg,p_type:ty});
  S.a4.checks.push({post:S.a4.cur,mySig:sg,myType:ty,key:r,score:Number(r.score)});S.a4.cur=null;
  S.a4.score=Math.round(S.a4.checks.reduce((t,c)=>t+c.score,0)/S.a4.checks.length*10)/10;save();a4Result(S.a4.checks.length-1);
 }catch(e){$('#ck').disabled=false;toast('ส่งไม่สำเร็จ ลองใหม่')}
}
function a4Result(open){
 a4mig();const A=S.a4,L=A.checks;if(open===undefined)open=L.length-1;
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 4</span><h2>ผลการตรวจข่าวของเพื่อน</h2><div class="score">${A.score}/3</div>
 <p class="mute">คะแนนเฉลี่ยจากข่าวที่ตรวจ ${L.length} ข่าว ข่าวละ 3 คะแนน (สัญญาณเตือนตรงกับผู้แต่ง 2 ประเภทถูก 1)</p>
 ${L.map((c,i)=>`<div class="step"><div class="sh" style="cursor:pointer" onclick="a4Result(${i})"><i>${i+1}</i><span style="flex:1">${esc(cut(c.post.headline,60))}</span><span>${c.score}/3</span></div>${i===open?a4Detail(c,i):''}</div>`).join('')}
 ${L.length<MAXC?`<button class="btn" onclick="a4Fetch()">ตรวจข่าวของเพื่อนต่อ (${L.length}/${MAXC})</button>`:''}
 <h3>ข่าวที่นักเรียนแต่ง</h3>${userMock({platform:A.mine.platform,sender:A.mine.sender,headline:A.mine.headline,body:A.mine.body})}
 <div>${A.mine.signals.map(s=>`<span class="tag">${SIG[s]}</span>`).join('')}<span class="tag g">${TYPES[A.mine.type]}</span></div>
 <button class="btn acc" onclick="go(5)">ไปกิจกรรมที่ 5</button></div>`);
 guessBox(open);
}
function a4Detail(c,i){const k=c.key;return `${userMock(c.post)}
 <label class="f">สัญญาณเตือน</label><div class="opts">${Object.keys(SIG).map(s=>{const a=k.signals.includes(s),m=c.mySig.includes(s);if(!a&&!m)return'';return `<span class="opt ${a&&m?'hit':m?'wrong':'missed'}">${SIG[s]} ${a&&m?'(พบ)':m?'(ไม่ได้ซ่อนไว้)':'(ยังไม่พบ)'}</span>`}).join('')}</div>
 <p>ประเภทที่ผู้แต่งตั้งใจ: <b>${TYPES[k.type]}</b> คำตอบของนักเรียน: ${TYPES[c.myType]}</p>
 <label class="f">ใครแต่งข่าวนี้</label><div id="guess"><p class="mute">กำลังโหลด</p></div>`}
const ROOM=()=>S.me.cls.replace('ม.','');
async function guessBox(i){
 const el=$('#guess');if(!el)return;const c=S.a4.checks[i],G=c.guess;
 if(G){el.innerHTML=`<div class="facts">นักเรียนเดาว่า <b>${esc(G.name)}</b><br>เบาะแส ${esc(G.reason)}${G.author?`<br>เฉลย ผู้แต่งคือ <b>${esc(G.author)}</b> ${G.correct?'<b style="color:var(--ok)">เดาถูก</b>':'<b style="color:var(--bad)">เดาไม่ถูก</b>'}`:''}</div>${G.author?'':'<p class="mute">ครูจะเฉลยต้นคาบหน้า</p><button class="btn ghost" onclick="checkReveal('+i+')">ดูเฉลย</button>'}`;return}
 let names=[];try{names=await rpc('news_room_roster',{p_room:ROOM()})||[]}catch(e){}
 const mine=(S.me.p||[]).map(x=>x.name);names=names.filter(n=>!mine.includes(n));
 el.innerHTML=`<p class="mute">เดาว่าเพื่อนคนไหนแต่ง ระหว่างสัปดาห์สืบเพิ่มได้ แต่เจ้าของข่าวห้ามบอกตรง ๆ ครูเฉลยต้นคาบหน้า ไม่นับคะแนน</p>
 <select id="gn"><option value="">เลือกชื่อ</option>${names.map(n=>`<option>${esc(n)}</option>`).join('')}</select>
 <textarea id="gr" placeholder="เบาะแสที่ใช้เดา เช่น สำนวน เรื่องที่เลือก ช่องทาง" style="min-height:60px;margin-top:8px"></textarea>
 <button class="btn ghost" onclick="sendGuess(${i})">บันทึกคำเดา</button>`;counter('gr',200);
}
async function sendGuess(i){
 const n=$('#gn').value,r=$('#gr').value.trim(),c=S.a4.checks[i];if(!n||r.length<5){toast('เลือกชื่อและเขียนเบาะแส');return}
 try{await rpc('news_submit_guess',{p_client:S.cid,p_post:c.post.id,p_guesser:S.me.name,p_guess:n,p_reason:r});c.guess={name:n,reason:r};save();guessBox(i);toast('บันทึกคำเดาแล้ว')}
 catch(e){toast(/revealed/.test(e.message)?'ครูเฉลยแล้ว เดาไม่ได้':'บันทึกไม่สำเร็จ')}
}
async function checkReveal(i){
 try{const r=await rpc('news_reveal_mine',{p_client:S.cid});if(!r.revealed){toast('ครูยังไม่เฉลย');return}
  (r.items||[]).forEach(it=>{const c=S.a4.checks.find(x=>x.post.id===it.post_id);if(c&&c.guess){c.guess.author=it.author;c.guess.correct=it.correct}});save();a4Result(i);
 }catch(e){toast('เชื่อมต่อไม่สำเร็จ')}
}
/* ---------- 5 line replies ---------- */

function a5Fake(){return S.a4&&S.a4.mine?S.a4.mine.headline:Q[7].h}
function a5mig(){if(S.a5&&S.a5.text&&!S.a5.fam){S.a5={fam:{text:S.a5.text,ck:S.a5.ck},score:S.a5.score}}}
function a5Score(){const f=S.a5.fam,c=S.a5.cls;S.a5.score=((f?f.ck.filter(Boolean).length:0)+(c&&c.ck?c.ck.filter(Boolean).length:0))/2}
function noPaste(id){const t=$('#'+id);t.addEventListener('paste',e=>{e.preventDefault();toast('กรุณาพิมพ์ข้อความเอง')});t.addEventListener('drop',e=>e.preventDefault())}
function a5(){
 a5mig();
 if(!S.a5||!S.a5.fam)return a5Fam();
 if(!S.a5.cls||!S.a5.cls.text)return a5Cls();
 a5Result();
}
function chatMock(group,who,msg,mine){return `<div class="mock line"><div class="lb">‹  ${group}</div><div class="chat"><div class="bub"><div class="nm">${who}</div>${esc(msg)}</div>${mine?`<div class="bub me">${esc(mine)}</div>`:''}</div></div>`}
function a5Fam(){
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 5.1 คู่หรือเดี่ยว</span><h2>ตอบป้าในไลน์ครอบครัว</h2><p>ป้าส่งข่าวปลอมเข้ากลุ่มไลน์ครอบครัว เขียนข้อความตอบให้สุภาพและได้ผล</p>
 ${chatMock('ครอบครัว (12)','ป้า',a5Fake()+'\nส่งต่อให้ทุกคนนะ เผื่อเป็นประโยชน์')}
 <h3>เกณฑ์ (ข้อละ 0.5 คะแนน)</h3>${RUB.map((r,i)=>`<div class="rub"><b>${i+1}. ${r.t}</b> ${r.d}</div>`).join('')}<div class="secend"></div>
 <label class="f">ข้อความตอบป้า</label><div class="hint">พิมพ์เอง อย่างน้อย 60 ตัวอักษร วางข้อความไม่ได้</div><textarea id="rp" style="min-height:110px"></textarea>
 <button class="btn acc" onclick="a5FamDone()">ส่ง แล้วไปตอบกลุ่มไลน์ห้อง</button></div>`);
 counter('rp',400);noPaste('rp');
}
function a5FamDone(){
 const v=$('#rp').value.trim();if(v.length<60){toast('เขียนอย่างน้อย 60 ตัวอักษร');return}
 S.a5={fam:{text:v,ck:RUB.map(r=>r.re.test(v)&&!(r.bad&&r.bad.test(v)))}};a5Score();save();a5Cls();
}
async function a5Cls(){
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 5.2</span><h2>ตอบเพื่อนในกลุ่มไลน์ห้อง</h2><p class="mute">กำลังโหลดข้อความในกลุ่ม</p></div>`);
 let p=S.a5.cls&&S.a5.cls.post;
 if(!p){const ex=[S.a4&&S.a4.postId].concat(S.a4&&S.a4.checks?S.a4.checks.map(c=>c.post.id):[]).filter(Boolean);
  try{const r=await rpc('news_random_post',{p_room:ROOM(),p_client:S.cid,p_exclude:ex});p=r&&r[0]}catch(e){}
  if(!p)p={id:null,headline:'ด่วน พรุ่งนี้โรงเรียนหยุดเรียนทั้งวัน ผอ.ประกาศแล้ว ส่งต่อให้ทุกคนด้วย',body:'',platform:'line',sender:'เพื่อนในห้อง'};
  S.a5.cls={post:p};save();}
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 5.2 คู่หรือเดี่ยว</span><h2>ตอบเพื่อนในกลุ่มไลน์ห้อง</h2><p>เพื่อนคนหนึ่งส่งข่าวนี้เข้ากลุ่มไลน์ห้อง ม.6/17 (ข่าวที่เพื่อนแต่งในกิจกรรมที่ 4) เขียนข้อความตอบในกลุ่ม</p>
 ${chatMock('ม.6/17 (32)','เพื่อนในห้อง',p.headline+(p.body?'\n'+p.body:''))}
 <h3>เกณฑ์ (ข้อละ 0.5 คะแนน)</h3>${RUB2.map((r,i)=>`<div class="rub"><b>${i+1}. ${r.t}</b> ${r.d}</div>`).join('')}<div class="secend"></div>
 <label class="f">ข้อความตอบในกลุ่มห้อง</label><div class="hint">พิมพ์เอง อย่างน้อย 60 ตัวอักษร ข้อความนี้ส่งถึงครู ครูอาจนำไปฉายบนจอโดยไม่แสดงชื่อ</div><textarea id="rc" style="min-height:110px"></textarea>
 <button class="btn acc" id="rcb" onclick="a5ClsDone()">ส่งข้อความ</button></div>`);
 counter('rc',400);noPaste('rc');
}
async function a5ClsDone(){
 const v=$('#rc').value.trim();if(v.length<60){toast('เขียนอย่างน้อย 60 ตัวอักษร');return}
 const ck=RUB2.map(r=>r.re.test(v)&&!(r.bad&&r.bad.test(v)));S.a5.cls.text=v;S.a5.cls.ck=ck;a5Score();save();
 if(S.a5.cls.post.id){try{await rpc('news_submit_reply',{p_client:S.cid,p_post:S.a5.cls.post.id,p_replier:S.me.name,p_text:v,p_ck:ck})}catch(e){}}
 a5Result();
}
function a5Result(){
 a5mig();const f=S.a5.fam,c=S.a5.cls;
 const blk=(title,rub,x,chat)=>`<h3>${title}</h3>${chat}${rub.map((r,i)=>`<div class="rub ${x.ck[i]?'ok':'no'}"><b>${x.ck[i]?'ผ่าน':'ยังไม่ผ่าน'} ${r.t}</b> ${r.d}</div>`).join('')}`;
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 5</span><h2>ผลการตอบข้อความ</h2><div class="score">${S.a5.score}/4</div><p class="mute">คะแนนจากระบบตรวจจากคำในข้อความ ครูตรวจทานอีกครั้ง</p>
 ${blk('5.1 ไลน์ครอบครัว',RUB,f,chatMock('ครอบครัว (12)','ป้า',a5Fake(),f.text))}
 ${blk('5.2 กลุ่มไลน์ห้อง',RUB2,c,chatMock('ม.6/17 (32)','เพื่อนในห้อง',c.post.headline,c.text))}
 <div class="facts"><b>ตัวอย่างข้อความตอบเพื่อนในกลุ่มห้อง</b><br>เราลองเช็กกับเพจทางการของโรงเรียนแล้ว ยังไม่มีประกาศเรื่องนี้นะ ทุกคนอย่าเพิ่งแชร์ต่อนะ เดี๋ยวเราทักไปหาเพื่อนส่วนตัว ช่วยลบหรือแก้ข้อความให้หน่อยนะ</div>
 <button class="btn acc" onclick="go(6)">ไปกิจกรรมที่ 6</button></div>`);
}
/* ---------- 6 summary & worksheet ---------- */
function a6(){
 const miss=ACTS.slice(0,5).filter(a=>!S[a.k]).map((a,i)=>ACTS.indexOf(a)+1);
 if(S.a6)return a6Sheet();
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 6</span><h2>สรุปท้ายคาบ</h2>
 ${miss.length?`<div class="note">ยังไม่ได้ทำกิจกรรมที่ ${miss.join(', ')} ใบงานจะแสดงว่ายังไม่ได้ทำ</div>`:''}
 <label class="f">สัญญาณเตือนที่จำได้ (เลือก 3 แบบ)</label>${optsHTML('es',SIG,[],true)}
 <label class="f">แหล่งตรวจสอบข่าวที่จะใช้ (1 แหล่ง)</label>${optsHTML('eo',Object.fromEntries(SRC.map((s,i)=>[i,s])))}
 <label class="f">ครั้งหน้าเมื่อเห็นข่าวน่าสงสัย ฉันจะ</label><textarea id="ew" style="min-height:70px"></textarea>
 <button class="btn acc" onclick="a6Done()">สร้างใบงาน</button></div>`);
 counter('ew',200);
}
function a6Done(){
 const sg=picked('es'),so=picked('eo')[0],w=$('#ew').value.trim();
 if(sg.length!==3){toast('เลือกสัญญาณเตือน 3 แบบพอดี');return}
 if(so===undefined||w.length<15){toast('เลือกแหล่งตรวจสอบและเขียนอย่างน้อย 15 ตัวอักษร');return}
 S.a6={sg,so:SRC[+so],w,score:2,at:new Date().toLocaleString('th-TH',{dateStyle:'long',timeStyle:'short'})};save();a6Sheet();
}
let CHK=null;
async function a6Sheet(){
 view(back()+`<div class="card"><span class="pill">กิจกรรมที่ 6</span><h2>ใบงานของนักเรียน</h2><p>ระบบส่งใบงานให้ครูแล้ว บันทึกเป็นรูปเพื่อแนบในงานของ Google Classroom</p><p class="mute" id="st">กำลังส่งใบงาน</p><div id="out"></div></div>`);
 try{CHK=await rpc('news_submit_sheet',{p_client:S.cid,p_name:S.me.name,p_cls:S.me.cls,p_no:S.me.no,p_data:S,p_total:totalSt(S)});if(!CHK.checked_at)CHK=null}catch(e){CHK=null;toast('ส่งใบงานเข้าระบบไม่สำเร็จ ยังบันทึกรูปได้ตามปกติ')}
 await drawSheet();
}
async function checkStatus(){try{const r=await rpc('news_sheet_status',{p_client:S.cid});CHK=r&&r.checked_at?r:null;await drawSheet();toast(CHK?'ครูตรวจแล้ว':'ครูยังไม่ได้ตรวจ')}catch(e){toast('เชื่อมต่อไม่สำเร็จ')}}
async function drawSheet(){
 $('#st').textContent='กำลังสร้างใบงาน';
 try{await document.fonts.ready;$('#ws').innerHTML=renderSheet(S,CHK);fitSheet($('#ws'));
  await Promise.all($$('#ws img').map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
  const c=await html2canvas($('#ws .pg'),{scale:1,backgroundColor:'#fff'});const u=c.toDataURL('image/png');
  const fn=`ใบงานสัปดาห์1_${S.me.cls.replace('ม.','ม')}_เลขที่${S.me.no}.png`.replace(/\//g,'-');
  $('#st').innerHTML=CHK?'<b style="color:#C8102E">ครูตรวจแล้ว</b>':'ส่งแล้ว รอครูตรวจ';
  $('#out').innerHTML=`<a class="btn acc" href="${u}" download="${fn}">บันทึกใบงานเป็นรูป</a><p class="mute" style="margin-top:8px">ถ้ากดแล้วไม่บันทึก ให้กดค้างที่รูปแล้วเลือกบันทึกรูปภาพ</p><img class="wsimg" src="${u}" alt="ใบงาน">
  <button class="btn ghost" onclick="checkStatus()">ดูผลการตรวจของครู</button>
  <h3>วิธีส่งใน Google Classroom</h3><div class="facts">1. เปิดงานที่ครูมอบหมาย<br>2. กด เพิ่มหรือสร้าง แล้วเลือก ไฟล์<br>3. เลือกรูปใบงาน<br>4. กด ส่ง</div>
  ${CHK?'':`<button class="btn ghost" onclick="S.a6=null;save();a6()">แก้ไขสรุปท้ายคาบ</button>`}`;
 }catch(e){$('#st').textContent='สร้างรูปไม่สำเร็จ ให้จับภาพหน้าจอส่งแทน'}
 $('#ws').innerHTML='';
}
if(SHOWQ){const q=Q.find(x=>String(x.id)===SHOWQ);document.body.innerHTML=`<div style="max-width:460px;margin:0 auto;padding:12px">${q?mock(q,true):''}</div>`;document.body.style.background='transparent'}else{setWho();home();if(S.me)report();}
if(!SHOWQ)setInterval(()=>{if(S.me&&document.visibilityState==='visible')report()},60000);
</script>
