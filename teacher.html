<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ครูตรวจใบงาน | ส33265</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script>
<style>
:root{--ink:#1E1B4B;--mute:#6B7280;--line:#E5E7EB;--acc:#6D28D9;--g1:linear-gradient(135deg,#7C3AED,#DB2777);--red:#C8102E}
*{box-sizing:border-box}body{margin:0;background:#F5F3FF;color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif}
h1,h2,button,.hd{font-family:'Anuphan',sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px}
.top{display:flex;align-items:center;gap:14px;background:var(--g1);color:#fff;border-radius:20px;padding:16px 20px}
.top img{width:46px;filter:brightness(0) invert(1)}.top h1{margin:0;font-size:22px}.top span{opacity:.85;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
button{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
button.acc{background:var(--g1)}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}button.red{background:var(--red)}
input,select,textarea{font:inherit;font-size:15px;border:1px solid #CBD5E1;border-radius:10px;padding:10px;background:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}th{font-family:'Anuphan';color:var(--mute);font-weight:600}
tr.row{cursor:pointer}tr.row:hover{background:#FAF5FF}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-family:'Anuphan';font-weight:600}
.b-ok{background:#FEE2E2;color:var(--red)}.b-wait{background:#EEF2FF;color:#4338CA}
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.sheetbox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.sheetbox .pg{transform-origin:0 0}
.side label{display:block;font-family:'Anuphan';font-weight:600;margin:12px 0 4px}
.side textarea,.side input{width:100%}
.stampdrop{animation:drop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{0%{transform:scale(2.4) rotate(10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.mute{color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
#ws{position:fixed;left:-99999px;top:0}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><img src="emblem.png" alt=""><div><h1>ครูตรวจใบงาน</h1><span>ส33265 เหตุการณ์ปัจจุบัน 2 สัปดาห์ที่ 1 ตรวจข่าวก่อนแชร์</span></div></div>
 <div id="v"></div>
</div>
<div id="ws"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let PIN=sessionStorage.getItem('tpin')||'',LIST=[],CUR=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)}
function login(){
 $('#v').innerHTML=`<div class="card" style="max-width:380px"><h2 style="margin-top:0">เข้าสู่ระบบครู</h2><input id="pin" type="password" inputmode="numeric" placeholder="รหัสครู" style="width:100%"><button class="acc" style="width:100%;margin-top:10px" onclick="tryLogin()">เข้าสู่ระบบ</button></div>`;
 $('#pin').onkeydown=e=>{if(e.key==='Enter')tryLogin()};
}
async function tryLogin(){PIN=$('#pin').value.trim();try{await rpc('news_teacher_list',{p_pin:PIN,p_cls:''});sessionStorage.setItem('tpin',PIN);list()}catch(e){toast('รหัสไม่ถูกต้อง')}}
async function list(){
 const cls=sessionStorage.getItem('tcls')||'';
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select id="cls"><option value="">ทุกห้อง</option><option ${cls==='ม.6/17'?'selected':''}>ม.6/17</option></select><button class="ghost" onclick="list()">รีเฟรช</button><button class="acc" onclick="monitor()">มอนิเตอร์ห้องเรียน</button><button class="acc" onclick="replies()">ข้อความตอบในกลุ่มห้อง</button><button class="acc" onclick="reveal()">เฉลยผู้แต่งข่าว</button><span class="mute" id="cnt"></span><button class="ghost" style="margin-left:auto" onclick="sessionStorage.removeItem('tpin');login()">ออกจากระบบ</button></div>
 <table style="margin-top:10px"><thead><tr><th>ชั้น</th><th>เลขที่</th><th>ชื่อ-สกุล</th><th>คะแนน</th><th>สถานะ</th><th>ส่งล่าสุด</th></tr></thead><tbody id="tb"><tr><td colspan="6" class="mute">กำลังโหลด</td></tr></tbody></table></div>`;
 $('#cls').onchange=e=>{sessionStorage.setItem('tcls',e.target.value);list()};
 try{LIST=await rpc('news_teacher_list',{p_pin:PIN,p_cls:cls})}catch(e){return login()}
 const done=LIST.filter(x=>x.checked_at).length;$('#cnt').textContent=`ส่งแล้ว ${LIST.length} คน ตรวจแล้ว ${done} คน`;
 $('#tb').innerHTML=LIST.length?LIST.map((r,i)=>`<tr class="row" onclick="openSheet(${i})"><td>${esc(r.cls)}</td><td>${esc(r.no)}</td><td>${esc(r.name)}</td><td>${r.score_override??r.total}/${TOTAL}</td><td>${r.checked_at?'<span class="badge b-ok">ตรวจแล้ว</span>':'<span class="badge b-wait">รอตรวจ</span>'}</td><td class="mute">${new Date(r.updated_at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td></tr>`).join(''):'<tr><td colspan="6" class="mute">ยังไม่มีใบงาน</td></tr>';
}
async function openSheet(i){
 CUR={i,row:LIST[i]};
 $('#v').innerHTML=`<div class="card"><button class="ghost" onclick="list()">กลับรายชื่อ</button></div><div class="grid" style="margin-top:14px"><div class="sheetbox" id="sb"><p class="mute" style="padding:16px">กำลังโหลด</p></div><div class="card side" style="margin-top:0" id="side"></div></div>`;
 const r=await rpc('news_teacher_get',{p_pin:PIN,p_id:CUR.row.id});CUR.full=r;
 renderCur();
}
function chkOf(r){return r.checked_at?{checked_at:r.checked_at,comment:r.comment,score_override:r.score_override}:(r.comment||r.score_override!=null?{comment:r.comment,score_override:r.score_override}:null)}
function renderCur(anim){
 const r=CUR.full,sb=$('#sb');
 sb.innerHTML=renderSheet(r.data,chkOf(r));
 const pg=sb.querySelector('.pg'),sc=sb.clientWidth/1754;pg.style.transform=`scale(${sc})`;sb.style.height=(1240*sc)+'px';
 if(anim){const st=pg.querySelector('.stamp');if(st)st.firstElementChild.classList.add('stampdrop')}
 $('#side').innerHTML=`<div class="hd" style="font-size:18px;font-weight:700">${esc(r.name)}</div><div class="mute">${esc(r.cls)} เลขที่ ${esc(r.no)}</div>
 <div style="margin-top:10px">คะแนนจากระบบ <b>${r.total}/${TOTAL}</b></div>
 <label>ปรับคะแนนรวม (เว้นว่างถ้าใช้คะแนนจากระบบ)</label><input id="ov" type="number" step="0.5" min="0" max="${TOTAL}" value="${r.score_override??''}">
 <label>ความคิดเห็นของครู</label><textarea id="cm" rows="3" maxlength="200">${esc(r.comment||'')}</textarea>
 ${r.checked_at?`<button class="ghost" style="width:100%;margin-top:12px" onclick="doCheck(false)">บันทึกการแก้ไข</button><button class="ghost" style="width:100%;margin-top:8px" onclick="doCheck(true)">ยกเลิกการตรวจ</button>`:`<button class="red" style="width:100%;margin-top:12px;font-size:17px" onclick="doCheck(false,true)">ตรวจแล้ว ปั๊มตรา</button>`}
 <button class="ghost" style="width:100%;margin-top:8px" onclick="saveImg()">บันทึกใบงานเป็นรูป</button>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="ghost" style="flex:1" ${CUR.i<=0?'disabled':''} onclick="openSheet(${CUR.i-1})">คนก่อนหน้า</button><button class="acc" style="flex:1" ${CUR.i>=LIST.length-1?'disabled':''} onclick="openSheet(${CUR.i+1})">คนถัดไป</button></div>`;
}
async function doCheck(undo,anim){
 const ov=$('#ov').value.trim(),cm=$('#cm').value.trim();
 try{const r=await rpc('news_teacher_check',{p_pin:PIN,p_id:CUR.row.id,p_comment:cm,p_score:ov===''?null:Number(ov),p_undo:!!undo});
  Object.assign(CUR.full,r);Object.assign(LIST[CUR.i],r);renderCur(anim);toast(undo?'ยกเลิกการตรวจแล้ว':'บันทึกแล้ว');
 }catch(e){toast('บันทึกไม่สำเร็จ')}
}
async function saveImg(){
 const r=CUR.full;$('#ws').innerHTML=renderSheet(r.data,chkOf(r));
 await Promise.all($$('#ws img').map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));
 const c=await html2canvas($('#ws .pg'),{scale:1,backgroundColor:'#fff'});$('#ws').innerHTML='';
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`ใบงาน_${r.cls}_เลขที่${r.no}.png`.replace(/\//g,'-');a.click();
}
const PL={web:'เว็บไซต์ข่าว',facebook:'เฟซบุ๊ก',tiktok:'ติ๊กต็อก',line:'ไลน์',sms:'SMS'};
async function reveal(){
 let R;try{R=await rpc('news_teacher_reveal_list',{p_pin:PIN,p_room:'6/17'})}catch(e){return login()}
 const ps=R.posts.filter(p=>!p.hidden);
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="list()">กลับรายชื่อ</button>
 <button class="${R.on?'ghost':'red'}" onclick="setReveal(${!R.on})">${R.on?'ปิดเฉลย':'เปิดเฉลยให้นักเรียนเห็น'}</button><span class="mute">${R.on?'นักเรียนกด ดูเฉลย ในกิจกรรมที่ 4 ได้แล้ว':'ยังไม่เปิดเฉลย เปิดแล้วนักเรียนเดาเพิ่มไม่ได้'}</span></div></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;margin-top:14px">${ps.map((p,i)=>`<div class="card" style="margin:0"><div class="mute">ข่าวที่ ${i+1} ${PL[p.platform]||''} ${esc(p.sender)}</div>
 <div class="hd" style="font-size:20px;font-weight:700;margin:6px 0">${esc(p.headline)}</div>
 <div class="rv" style="font-size:20px;margin-top:8px;${R.on?'':'filter:blur(9px)'}" onclick="this.style.filter=''">ผู้แต่ง <b style="color:#C8102E">${esc(p.author)}</b></div>
 <div class="mute" style="margin-top:6px">มีคนเดา ${p.guesses} คน เดาถูก ${p.correct.length} คน${p.correct.length?` (${p.correct.map(esc).join(', ')})`:''}</div></div>`).join('')||'<div class="card">ยังไม่มีข่าว</div>'}</div>
 <p class="mute">ชื่อผู้แต่งเบลอไว้จนกว่าจะเปิดเฉลย แตะที่ชื่อเพื่อเฉลยทีละข่าวบนจอได้</p>`;
}
let MON=null;
const ANAME=['เกม','สัญญาณเตือน','ตรวจข่าว','แต่งข่าว','ตอบไลน์','ใบงาน'];
async function monitor(){
 clearInterval(MON);
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="clearInterval(MON);list()">กลับรายชื่อ</button><b class="hd" style="font-size:18px">มอนิเตอร์ห้อง ม.6/17</b><span class="mute" id="mt"></span></div><div id="sum" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px"></div></div><div class="card"><table><thead><tr><th>เลขที่</th><th>ชื่อ</th>${ANAME.map((a,i)=>`<th style="text-align:center">${i+1}<br><span style="font-weight:400">${a}</span></th>`).join('')}<th>กำลังทำ</th><th>คะแนน</th><th>ล่าสุด</th></tr></thead><tbody id="mb"></tbody></table></div>`;
 const load=async()=>{let R;try{R=await rpc('news_teacher_progress',{p_pin:PIN,p_cls:'ม.6/17'})}catch(e){return}
  const now=Date.now();
  $('#sum').innerHTML=ANAME.map((a,i)=>{const k='a'+(i+1),n=R.filter(r=>r.done.includes(k)).length;return `<div style="background:#F5F3FF;border-radius:12px;padding:10px;text-align:center"><div class="mute">${i+1}. ${a}</div><div class="hd" style="font-size:26px;font-weight:700;color:#6D28D9">${n}/${R.length}</div></div>`}).join('');
  $('#mb').innerHTML=R.map(r=>{const idle=(now-new Date(r.updated_at))/60000;return `<tr><td>${esc(r.no)}</td><td>${esc(r.name)}</td>${ANAME.map((a,i)=>`<td style="text-align:center;font-size:18px;color:${r.done.includes('a'+(i+1))?'#16A34A':'#CBD5E1'}">${r.done.includes('a'+(i+1))?'✓':'–'}</td>`).join('')}<td>${r.current?'กิจกรรมที่ '+r.current:'-'}</td><td><b>${r.score}</b>/${TOTAL}</td><td style="color:${idle>3?'#C8102E':'#6B7280'}">${idle<1?'เมื่อสักครู่':Math.round(idle)+' นาทีก่อน'}${r.checked?' <span class="badge b-ok">ตรวจแล้ว</span>':r.submitted?' <span class="badge b-wait">ส่งแล้ว</span>':''}</td></tr>`}).join('')||'<tr><td colspan="11" class="mute">ยังไม่มีนักเรียนเข้าเว็บ</td></tr>';
  $('#mt').textContent=`เข้าเว็บแล้ว ${R.length} เครื่อง อัปเดต ${new Date().toLocaleTimeString('th-TH')} (รีเฟรชทุก 10 วินาที)`;
 };
 await load();MON=setInterval(()=>{if(!$('#mb'))return clearInterval(MON);load()},10000);
}
let SHOWN=false;
async function replies(){
 let R;try{R=await rpc('news_teacher_replies',{p_pin:PIN,p_room:'6/17'})}catch(e){return login()}
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="list()">กลับรายชื่อ</button><b class="hd" style="font-size:18px">ข้อความตอบเพื่อนในกลุ่มไลน์ห้อง</b><button class="ghost" onclick="SHOWN=!SHOWN;replies()">${SHOWN?'ซ่อนชื่อ':'แสดงชื่อ'}</button><button class="ghost" onclick="replies()">รีเฟรช</button></div></div>
 ${R.map((p,i)=>`<div class="card"><div class="mute">ข่าวที่เพื่อนส่งเข้ากลุ่ม ${PL[p.platform]||''}</div><div class="hd" style="font-size:20px;font-weight:700;margin:4px 0 10px">${esc(p.headline)}</div>
 ${p.replies.map(r=>`<div style="display:flex;gap:10px;align-items:flex-start;margin:8px 0"><div style="background:#06C755;color:#fff;border-radius:16px;border-top-right-radius:4px;padding:10px 14px;font-size:18px;line-height:1.55;flex:1">${esc(r.text)}</div><div style="min-width:120px;text-align:right"><span class="badge ${r.score>=3?'b-ok':'b-wait'}">เกณฑ์ ${r.score}/4</span>${SHOWN?`<div class="mute" style="margin-top:4px">${esc(r.replier)}</div>`:''}</div></div>`).join('')}</div>`).join('')||'<div class="card">ยังไม่มีข้อความตอบ</div>'}`;
}
async function setReveal(on){try{await rpc('news_teacher_reveal',{p_pin:PIN,p_on:on});reveal()}catch(e){toast('บันทึกไม่สำเร็จ')}}
window.addEventListener('resize',()=>{if(CUR&&CUR.full&&$('#sb'))renderCur()});
PIN?list():login();
</script>
</body>
</html>
