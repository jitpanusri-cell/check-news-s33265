<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ครูตรวจใบงาน | ส33265</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="common.js"></script>
<style>
:root{--ink:#1E1B4B;--mute:#6B7280;--line:#E5E7EB;--acc:#6D28D9;--g1:linear-gradient(135deg,#7C3AED,#DB2777);--red:#C8102E}
*{box-sizing:border-box}body{margin:0;background:#F5F3FF;color:var(--ink);font-family:'IBM Plex Sans Thai',sans-serif}
h1,h2,button,.hd{font-family:'Anuphan',sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:18px}
.top{display:flex;align-items:center;gap:14px;background:var(--g1);color:#fff;border-radius:20px;padding:16px 20px}
.top img{width:46px;filter:brightness(0) invert(1)}.top h1{margin:0;font-size:22px}.top span{opacity:.85;font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
button{border:0;border-radius:12px;padding:11px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--ink);color:#fff}
button.acc{background:var(--g1)}button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}button.red{background:var(--red)}
input,select,textarea{font:inherit;font-size:15px;border:1px solid #CBD5E1;border-radius:10px;padding:10px;background:#fff}
table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}th{font-family:'Anuphan';color:var(--mute);font-weight:600}
tr.row{cursor:pointer}tr.row:hover{background:#FAF5FF}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:13px;font-family:'Anuphan';font-weight:600}
.b-ok{background:#FEE2E2;color:var(--red)}.b-wait{background:#EEF2FF;color:#4338CA}
.grid{display:grid;grid-template-columns:1fr 320px;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.sheetbox{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;position:relative}
.sheetbox .pg{transform-origin:0 0}
.side label{display:block;font-family:'Anuphan';font-weight:600;margin:12px 0 4px}
.side textarea,.side input{width:100%}
.stampdrop{animation:drop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes drop{0%{transform:scale(2.4) rotate(10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.mute{color:var(--mute);font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:.25s;pointer-events:none}.toast.on{opacity:1}
#ws{position:fixed;left:-99999px;top:0}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.proj{position:fixed;inset:0;z-index:60;background:#F5F3FF;overflow:auto;padding:24px}
.proj .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--g1);color:#fff;border-radius:18px;padding:12px 16px}
.proj .bar .alias{font-family:Anuphan;font-weight:700;font-size:24px;margin-right:auto}
.proj .tab{background:rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:8px 12px}.proj .tab.on{background:#fff;color:#6D28D9}
.pw{max-width:980px;margin:18px auto;font-size:21px;line-height:1.6}
.pw .c{background:#fff;border-radius:18px;padding:18px 20px;margin:12px 0;border:1px solid var(--line)}
.pw .q{color:var(--mute);font-size:17px}.pw .a{color:#1D3FB8}
.pw .ok{color:#16A34A;font-weight:700}.pw .no{color:#C8102E;font-weight:700}
.pw .chat{background:#7494C0;border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pw .bub{background:#fff;border-radius:16px;border-top-left-radius:4px;padding:10px 14px;max-width:80%}.pw .bub.me{align-self:flex-end;background:#06C755;color:#fff;border-top-left-radius:16px;border-top-right-radius:4px}
.pw .tag{display:inline-block;background:#FEF3C7;color:#78350F;border-radius:999px;padding:3px 12px;margin:4px 6px 0 0;font-size:16px}
.bigtimer{font-family:Anuphan;font-weight:700;font-size:28px;color:#6D28D9}
</style>
</head>
<body>
<div class="wrap">
 <div class="top"><img src="emblem.png" alt=""><div><h1>ครูตรวจใบงาน</h1><span>ส33265 เหตุการณ์ปัจจุบัน 2 สัปดาห์ที่ 1 ตรวจข่าวก่อนแชร์</span></div></div>
 <div id="v"></div>
</div>
<div id="ws"></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let PIN=sessionStorage.getItem('tpin')||'',LIST=[],CUR=null;
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2000)}
function login(){
 $('#v').innerHTML=`<div class="card" style="max-width:380px"><h2 style="margin-top:0">เข้าสู่ระบบครู</h2><input id="pin" type="password" inputmode="numeric" placeholder="รหัสครู" style="width:100%"><button class="acc" style="width:100%;margin-top:10px" onclick="tryLogin()">เข้าสู่ระบบ</button></div>`;
 $('#pin').onkeydown=e=>{if(e.key==='Enter')tryLogin()};
}
async function tryLogin(){PIN=$('#pin').value.trim();try{await rpc('news_teacher_list',{p_pin:PIN,p_cls:''});sessionStorage.setItem('tpin',PIN);list()}catch(e){toast('รหัสไม่ถูกต้อง')}}
async function list(){
 const cls=sessionStorage.getItem('tcls')||'';
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><select id="cls"><option value="">ทุกห้อง</option><option ${cls==='ม.6/17'?'selected':''}>ม.6/17</option></select><button class="ghost" onclick="list()">รีเฟรช</button><button class="acc" onclick="monitor()">มอนิเตอร์ห้องเรียน</button><button class="acc" onclick="replies()">ข้อความตอบในกลุ่มห้อง</button><button class="acc" onclick="reveal()">เฉลยผู้แต่งข่าว</button><span class="mute" id="cnt"></span><button class="ghost" style="margin-left:auto" onclick="sessionStorage.removeItem('tpin');login()">ออกจากระบบ</button></div>
 <table style="margin-top:10px"><thead><tr><th>ชั้น</th><th>เลขที่</th><th>ชื่อ-สกุล</th><th>คะแนน</th><th>สถานะ</th><th>ส่งล่าสุด</th></tr></thead><tbody id="tb"><tr><td colspan="6" class="mute">กำลังโหลด</td></tr></tbody></table></div>`;
 $('#cls').onchange=e=>{sessionStorage.setItem('tcls',e.target.value);list()};
 try{LIST=await rpc('news_teacher_list',{p_pin:PIN,p_cls:cls})}catch(e){return login()}
 const done=LIST.filter(x=>x.checked_at).length;$('#cnt').textContent=`ส่งแล้ว ${LIST.length} คน ตรวจแล้ว ${done} คน`;
 $('#tb').innerHTML=LIST.length?LIST.map((r,i)=>`<tr class="row" onclick="openSheet(${i})"><td>${esc(r.cls)}</td><td>${esc(r.no)}</td><td>${esc(r.name)}</td><td>${r.score_override??r.total}/${TOTAL}</td><td>${r.checked_at?'<span class="badge b-ok">ตรวจแล้ว</span>':'<span class="badge b-wait">รอตรวจ</span>'}</td><td class="mute">${new Date(r.updated_at).toLocaleString('th-TH',{dateStyle:'short',timeStyle:'short'})}</td></tr>`).join(''):'<tr><td colspan="6" class="mute">ยังไม่มีใบงาน</td></tr>';
}
async function openSheet(i){
 CUR={i,row:LIST[i]};
 $('#v').innerHTML=`<div class="card"><button class="ghost" onclick="list()">กลับรายชื่อ</button></div><div class="grid" style="margin-top:14px"><div class="sheetbox" id="sb"><p class="mute" style="padding:16px">กำลังโหลด</p></div><div class="card side" style="margin-top:0" id="side"></div></div>`;
 const r=await rpc('news_teacher_get',{p_pin:PIN,p_id:CUR.row.id});CUR.full=r;
 renderCur();
}
function chkOf(r){return r.checked_at?{checked_at:r.checked_at,comment:r.comment,score_override:r.score_override}:(r.comment||r.score_override!=null?{comment:r.comment,score_override:r.score_override}:null)}
function renderCur(anim){
 const r=CUR.full,sb=$('#sb');
 sb.innerHTML=renderSheet(r.data,chkOf(r));
 const pg=sb.querySelector('.pg'),sc=sb.clientWidth/1754;pg.style.transform=`scale(${sc})`;sb.style.height=(1240*sc)+'px';
 if(anim){const st=pg.querySelector('.stamp');if(st)st.firstElementChild.classList.add('stampdrop')}
 $('#side').innerHTML=`<div class="hd" style="font-size:18px;font-weight:700">${esc(r.name)}</div><div class="mute">${esc(r.cls)} เลขที่ ${esc(r.no)}</div>
 <div style="margin-top:10px">คะแนนจากระบบ <b>${r.total}/${TOTAL}</b></div>
 <label>ปรับคะแนนรวม (เว้นว่างถ้าใช้คะแนนจากระบบ)</label><input id="ov" type="number" step="0.5" min="0" max="${TOTAL}" value="${r.score_override??''}">
 <label>ความคิดเห็นของครู</label><textarea id="cm" rows="3" maxlength="200">${esc(r.comment||'')}</textarea>
 ${r.checked_at?`<button class="ghost" style="width:100%;margin-top:12px" onclick="doCheck(false)">บันทึกการแก้ไข</button><button class="ghost" style="width:100%;margin-top:8px" onclick="doCheck(true)">ยกเลิกการตรวจ</button>`:`<button class="red" style="width:100%;margin-top:12px;font-size:17px" onclick="doCheck(false,true)">ตรวจแล้ว ปั๊มตรา</button>`}
 <button class="ghost" style="width:100%;margin-top:18px;color:#C8102E;border-color:#FCA5A5" onclick="delWork('sheet',CUR.row.id,CUR.row.name)">ลบงานของคู่นี้</button>
 <button class="ghost" style="width:100%;margin-top:8px" onclick="saveImg()">บันทึกใบงานเป็นรูป</button>
 <div style="display:flex;gap:8px;margin-top:8px"><button class="ghost" style="flex:1" ${CUR.i<=0?'disabled':''} onclick="openSheet(${CUR.i-1})">คนก่อนหน้า</button><button class="acc" style="flex:1" ${CUR.i>=LIST.length-1?'disabled':''} onclick="openSheet(${CUR.i+1})">คนถัดไป</button></div>`;
}
async function doCheck(undo,anim){
 const ov=$('#ov').value.trim(),cm=$('#cm').value.trim();
 try{const r=await rpc('news_teacher_check',{p_pin:PIN,p_id:CUR.row.id,p_comment:cm,p_score:ov===''?null:Number(ov),p_undo:!!undo});
  Object.assign(CUR.full,r);Object.assign(LIST[CUR.i],r);renderCur(anim);toast(undo?'ยกเลิกการตรวจแล้ว':'บันทึกแล้ว');
 }catch(e){toast('บันทึกไม่สำเร็จ')}
}
async function saveImg(){
 const r=CUR.full;$('#ws').innerHTML=renderSheet(r.data,chkOf(r));
 await Promise.all($$('#ws img').map(i=>i.complete?0:new Promise(z=>{i.onload=i.onerror=z})));
 const c=await html2canvas($('#ws .pg'),{scale:1,backgroundColor:'#fff'});$('#ws').innerHTML='';
 const a=document.createElement('a');a.href=c.toDataURL('image/png');a.download=`ใบงาน_${r.cls}_เลขที่${r.no}.png`.replace(/\//g,'-');a.click();
}
const PL={web:'เว็บไซต์ข่าว',facebook:'เฟซบุ๊ก',tiktok:'ติ๊กต็อก',line:'ไลน์',sms:'SMS'};
async function reveal(){
 let R;try{R=await rpc('news_teacher_reveal_list',{p_pin:PIN,p_room:'6/17'})}catch(e){return login()}
 const ps=R.posts.filter(p=>!p.hidden);
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="list()">กลับรายชื่อ</button>
 <button class="${R.on?'ghost':'red'}" onclick="setReveal(${!R.on})">${R.on?'ปิดเฉลย':'เปิดเฉลยให้นักเรียนเห็น'}</button><span class="mute">${R.on?'นักเรียนกด ดูเฉลย ในกิจกรรมที่ 4 ได้แล้ว':'ยังไม่เปิดเฉลย เปิดแล้วนักเรียนเดาเพิ่มไม่ได้'}</span></div></div>
 <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px;margin-top:14px">${ps.map((p,i)=>`<div class="card" style="margin:0"><div class="mute">ข่าวที่ ${i+1} ${PL[p.platform]||''} ${esc(p.sender)}</div>
 <div class="hd" style="font-size:20px;font-weight:700;margin:6px 0">${esc(p.headline)}</div>
 <div class="rv" style="font-size:20px;margin-top:8px;${R.on?'':'filter:blur(9px)'}" onclick="this.style.filter=''">ผู้แต่ง <b style="color:#C8102E">${esc(p.author)}</b></div>
 <div class="mute" style="margin-top:6px">มีคนเดา ${p.guesses} คน เดาถูก ${p.correct.length} คน${p.correct.length?` (${p.correct.map(esc).join(', ')})`:''}</div></div>`).join('')||'<div class="card">ยังไม่มีข่าว</div>'}</div>
 <p class="mute">ชื่อผู้แต่งเบลอไว้จนกว่าจะเปิดเฉลย แตะที่ชื่อเพื่อเฉลยทีละข่าวบนจอได้</p>`;
}
let MON=null;
const ANAME=['เกม','สัญญาณเตือน','ตรวจข่าว','แต่งข่าว','ตอบไลน์','ใบงาน'];
async function monitor(){
 clearInterval(MON);
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="clearInterval(MON);list()">กลับรายชื่อ</button><b class="hd" style="font-size:18px">มอนิเตอร์ห้อง ม.6/17</b><span class="mute" id="mt"></span><button class="ghost" style="margin-left:auto" onclick="hard()">ข่าวในเกมที่ตัดสินยากสุด</button></div><div class="ctl" id="ctl"></div><div id="sum" style="display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px"></div></div><div class="card"><table><thead><tr><th>เลขที่</th><th>ชื่อ</th>${ANAME.map((a,i)=>`<th style="text-align:center">${i+1}<br><span style="font-weight:400">${a}</span></th>`).join('')}<th>กำลังทำ</th><th>คะแนน</th><th>ล่าสุด</th><th></th></tr></thead><tbody id="mb"></tbody></table></div>`;
 const load=async()=>{let R;try{R=await rpc('news_teacher_progress',{p_pin:PIN,p_cls:'ม.6/17'})}catch(e){return}
  const now=Date.now();
  $('#sum').innerHTML=ANAME.map((a,i)=>{const k='a'+(i+1),n=R.filter(r=>r.done.includes(k)).length;return `<div style="background:#F5F3FF;border-radius:12px;padding:10px;text-align:center"><div class="mute">${i+1}. ${a}</div><div class="hd" style="font-size:26px;font-weight:700;color:#6D28D9">${n}/${R.length}</div></div>`}).join('');
  window._MON=R;$('#mb').innerHTML=R.map((r,ri)=>{const idle=(now-new Date(r.updated_at))/60000;return `<tr class="row" onclick="openWork(${ri})"><td>${esc(r.no)}</td><td>${esc(r.name)}</td>${ANAME.map((a,i)=>`<td style="text-align:center;font-size:18px;color:${r.done.includes('a'+(i+1))?'#16A34A':'#CBD5E1'}">${r.done.includes('a'+(i+1))?'✓':'–'}</td>`).join('')}<td>${r.current?'กิจกรรมที่ '+r.current:'-'}</td><td><b>${r.score}</b>/${TOTAL}</td><td style="color:${idle>3?'#C8102E':'#6B7280'}">${idle<1?'เมื่อสักครู่':Math.round(idle)+' นาทีก่อน'}${r.checked?' <span class="badge b-ok">ตรวจแล้ว</span>':r.submitted?' <span class="badge b-wait">ส่งแล้ว</span>':''}</td><td><button class="ghost" style="padding:4px 10px;color:#C8102E;border-color:#FCA5A5" onclick="event.stopPropagation();delWork('client','${esc(r.client_id)}','${esc(r.name).replace(/'/g,'')}')">ลบ</button></td></tr>`}).join('')||'<tr><td colspan="12" class="mute">ยังไม่มีนักเรียนเข้าเว็บ</td></tr>';
  $('#mt').textContent=`เข้าเว็บแล้ว ${R.length} เครื่อง อัปเดต ${new Date().toLocaleTimeString('th-TH')} (รีเฟรชทุก 10 วินาที)`;
 };
 await load();await ctl();MON=setInterval(()=>{if(!$('#mb'))return clearInterval(MON);load()},10000);
}
let SHOWN=false;
async function replies(){
 let R;try{R=await rpc('news_teacher_replies',{p_pin:PIN,p_room:'6/17'})}catch(e){return login()}
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="list()">กลับรายชื่อ</button><b class="hd" style="font-size:18px">ข้อความตอบเพื่อนในกลุ่มไลน์ห้อง</b><button class="ghost" onclick="SHOWN=!SHOWN;replies()">${SHOWN?'ซ่อนชื่อ':'แสดงชื่อ'}</button><button class="ghost" onclick="replies()">รีเฟรช</button></div></div>
 ${R.map((p,i)=>`<div class="card"><div class="mute">ข่าวที่เพื่อนส่งเข้ากลุ่ม ${PL[p.platform]||''}</div><div class="hd" style="font-size:20px;font-weight:700;margin:4px 0 10px">${esc(p.headline)}</div>
 ${p.replies.map(r=>`<div style="display:flex;gap:10px;align-items:flex-start;margin:8px 0"><div style="background:#06C755;color:#fff;border-radius:16px;border-top-right-radius:4px;padding:10px 14px;font-size:18px;line-height:1.55;flex:1">${esc(r.text)}</div><div style="min-width:120px;text-align:right"><span class="badge ${r.score>=3?'b-ok':'b-wait'}">เกณฑ์ ${r.score}/4</span>${SHOWN?`<div class="mute" style="margin-top:4px">${esc(r.replier)}</div>`:''}</div></div>`).join('')}</div>`).join('')||'<div class="card">ยังไม่มีข้อความตอบ</div>'}`;
}
let CST=null,CTK=null;
async function ctl(r){
 if(!r){try{r=await rpc('news_class_state',{})}catch(e){return}}CST=r;CST.skew=Date.now()-new Date(r.now).getTime();
 const el=$('#ctl');if(!el)return;
 el.innerHTML=`<button class="${r.pause?'acc':'red'}" onclick="setState({p_pause:${!r.pause}})">${r.pause?'ให้นักเรียนทำต่อ':'หยุด ให้ทุกคนมองจอครู'}</button>
 <select id="tl">${ANAME.map((a,i)=>`<option>กิจกรรมที่ ${i+1} ${a}</option>`).join('')}</select>
 ${[3,5,8,12,15].map(m=>`<button class="ghost" onclick="setState({p_minutes:${m},p_label:$('#tl').value})">${m} นาที</button>`).join('')}
 <button class="ghost" onclick="setState({p_clear_timer:true})">ล้างเวลา</button><span class="bigtimer" id="ttk"></span>`;
 clearInterval(CTK);CTK=setInterval(tick,1000);tick();
}
function tick(){const e=$('#ttk');if(!e)return clearInterval(CTK);if(!CST||!CST.timer_end){e.textContent=CST&&CST.pause?'หยุดอยู่':'';return}
 const left=Math.round((new Date(CST.timer_end).getTime()-(Date.now()-CST.skew))/1000);e.textContent=(CST.timer_label||'')+'  '+(left>0?`${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}`:'หมดเวลา');}
async function setState(o){try{const r=await rpc('news_teacher_set_state',Object.assign({p_pin:PIN,p_pause:null,p_minutes:null,p_label:null,p_clear_timer:false},o));ctl(r)}catch(e){toast('บันทึกไม่สำเร็จ')}}
let PW={i:0,tab:1,show:false,data:null};
async function openWork(i){const r=window._MON[i];PW={i,tab:r.current||1,show:false,data:null};
 let d=null;try{d=await rpc('news_teacher_snapshot',{p_pin:PIN,p_client:r.client_id})}catch(e){}PW.data=d||{};drawWork()}
function drawWork(){
 const r=window._MON[PW.i],d=PW.data,ov=$('#proj')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'proj',className:'proj'}));
 const alias=PW.show?esc(r.name):`คู่ที่ ${PW.i+1}`;
 ov.innerHTML=`<div class="bar"><span class="alias">${alias}</span>${ANAME.map((a,i)=>`<button class="tab ${PW.tab===i+1?'on':''}" onclick="PW.tab=${i+1};drawWork()">${i+1} ${a}</button>`).join('')}
 <button class="tab" onclick="PW.show=!PW.show;drawWork()">${PW.show?'ซ่อนชื่อ':'แสดงชื่อ'}</button><button class="tab" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})">เต็มจอ</button>
 <button class="tab" ${PW.i<=0?'disabled':''} onclick="openWork(${PW.i-1})">คู่ก่อน</button><button class="tab" ${PW.i>=window._MON.length-1?'disabled':''} onclick="openWork(${PW.i+1})">คู่ถัดไป</button><button class="tab" onclick="$('#proj').remove()">ปิด</button></div>
 <div class="pw">${workTab(d,PW.tab)}</div>`;
}
function workTab(d,n){
 const E=x=>esc(x||''),none='<div class="c q">ยังไม่ได้ทำกิจกรรมนี้</div>';
 if(n===1){if(!d.a1)return none;return `<div class="c"><div class="q">เกมจริงหรือหลอก คะแนน</div><div style="font-size:44px;font-weight:700;color:#6D28D9">${d.a1.score}/8</div></div>`+d.a1.res.map(x=>{const q=Q.find(y=>y.id===x.id);return `<div class="c"><span class="${x.ok?'ok':'no'}">${x.ok?'ถูก':'ผิด'}</span> ${E(q.h)}<div class="q">ตอบ ${x.v===null?'หมดเวลา':x.v?'จริง':'หลอก'} เฉลย ${q.a?'จริง':'หลอก'}</div></div>`}).join('')}
 if(n===2){if(!d.a2)return none;return CASES.map((c,i)=>`<div class="c"><div class="q">${i+1}) ${E(c.t)}</div><span class="${d.a2.ch[i]===c.a?'ok':'no'}">${TYPES[d.a2.ch[i]]||''}</span></div>`).join('')+A2Q.map((q,i)=>`<div class="c"><div class="q">${E(q)}</div><div class="a">${E(d.a2.w[i])}</div></div>`).join('')}
 if(n===3){if(!d.a3)return d.a3case?`<div class="c q">ได้ข่าวที่ ${d.a3case} กำลังตรวจ</div>`:none;const q=Q.find(x=>x.id===d.a3.id);return `<div class="c"><div class="q">ข่าวที่ ${d.a3.id}</div><b>${E(q.h)}</b></div>`+STEPS.map((s,i)=>`<div class="c"><div class="q">${i+1}. ${s.t}</div><div class="a">${E(d.a3.st[i])}</div></div>`).join('')+`<div class="c"><div class="q">ข้อสรุป</div><b>${{real:'ข่าวจริง',fake:'ข่าวปลอม',unsure:'ยังสรุปไม่ได้'}[d.a3.v]}</b><div class="a">${E(d.a3.rs)}</div><div class="q">เฉลย ${q.a?'ข่าวจริง':'ข่าวปลอม'}</div></div>`}
 if(n===4){const A=d.a4;if(!A||!A.mine)return none;const CH=A.checks||(A.check?[A.check]:[]);return `<div class="c"><div class="q">ข่าวปลอมที่แต่ง ${PLAT[A.mine.platform]} ${E(A.mine.sender)}</div><div style="font-size:26px;font-weight:700">${E(A.mine.headline)}</div><div>${E(A.mine.body)}</div><div>${A.mine.signals.map(s=>`<span class="tag">${SIG[s]}</span>`).join('')}<span class="tag">${TYPES[A.mine.type]}</span></div></div>`+CH.map((c,i)=>`<div class="c"><div class="q">ตรวจข่าวเพื่อน ${i+1} คะแนน ${c.score??A.score}/3</div><b>${E(c.post.headline)}</b><div class="a">พบ ${c.mySig.map(s=>SIG[s]).join(', ')} / ${TYPES[c.myType]}</div><div class="q">ผู้แต่งซ่อน ${c.key.signals.map(s=>SIG[s]).join(', ')} / ${TYPES[c.key.type]}</div></div>`).join('')}
 if(n===5){let A=d.a5;if(!A)return none;if(A.text&&!A.fam)A={fam:{text:A.text,ck:A.ck}};const fk=d.a4&&d.a4.mine?d.a4.mine.headline:Q[7].h;
  const ch=(g,who,msg,x,R)=>x&&x.text?`<div class="c"><div class="q">${g}</div><div class="chat"><div class="bub"><div class="q">${who}</div>${E(msg)}</div><div class="bub me">${E(x.text)}</div></div><div class="q" style="margin-top:8px">ผ่าน ${x.ck.filter(Boolean).length}/4 ${R.filter((r,i)=>x.ck[i]).map(r=>r.t).join(', ')}</div></div>`:'';
  return ch('5.1 ไลน์ครอบครัว','ป้า',fk,A.fam,RUB)+ch('5.2 กลุ่มไลน์ห้อง','เพื่อนในห้อง',A.cls&&A.cls.post?A.cls.post.headline:'',A.cls,RUB2)||none}
 if(n===6){if(!d.a6)return none;return `<div class="c"><div class="q">สัญญาณเตือนที่จำได้</div>${d.a6.sg.map(s=>`<span class="tag">${SIG[s]}</span>`).join('')}</div><div class="c"><div class="q">แหล่งตรวจสอบ</div><div class="a">${E(d.a6.so)}</div></div><div class="c"><div class="q">ครั้งหน้าฉันจะ</div><div class="a">${E(d.a6.w)}</div></div>`}
 return none;
}
async function setReveal(on){try{await rpc('news_teacher_reveal',{p_pin:PIN,p_on:on});reveal()}catch(e){toast('บันทึกไม่สำเร็จ')}}
window.addEventListener('resize',()=>{if(CUR&&CUR.full&&$('#sb'))renderCur()});
PIN?list():login();

let HQ=null;
async function hard(){
 let R,V=[];try{R=await rpc('news_teacher_a1_stats',{p_pin:PIN,p_cls:'ม.6/17'});V=await rpc('news_teacher_hard_votes',{p_pin:PIN,p_cls:'ม.6/17'})||[]}catch(e){return}
 HQ=Q.map(q=>{let t=0,f=0,n=0,ok=0;R.forEach(res=>{const x=(res||[]).find(y=>y.id===q.id);if(!x)return;x.v===true?t++:x.v===false?f++:n++;if(x.ok)ok++});const all=t+f+n,vw=V.filter(v=>v.id===q.id).map(v=>v.why);return {q,t,f,n,all,ok,vw,pc:all?ok/all:1}}).sort((a,b)=>b.vw.length-a.vw.length||a.pc-b.pc||b.n-a.n);
 const pairs=R.length;
 $('#v').innerHTML=`<div class="card"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="ghost" onclick="monitor()">กลับมอนิเตอร์</button><b class="hd" style="font-size:18px">ข่าวในเกมที่ตัดสินยากสุด</b><span class="mute">เล่นเกมจบแล้ว ${pairs} คู่ เรียงจากข่าวที่นักเรียนเลือกว่ายากมากสุด (กิจกรรมที่ 2) แล้วตามตอบถูกน้อย คลิกข่าวเพื่อขึ้นจอ</span><button class="ghost" style="margin-left:auto" onclick="hard()">รีเฟรช</button></div></div>
 <div class="card">${HQ.map((h,i)=>{const w=v=>h.all?(v/h.all*100):0;return `<div class="row" onclick="hardShow(${i})" style="display:flex;gap:14px;align-items:center;padding:12px 6px;border-bottom:1px solid #EEE;cursor:pointer">
 <b class="hd" style="font-size:22px;color:#6D28D9;min-width:28px">${i+1}</b>
 <div style="flex:1"><div style="font-weight:600">${esc(cut(h.q.h,90))}</div><div class="mute" style="font-size:13px">${PLAT[h.q.p==='fblink'?'facebook':h.q.p]||''}</div>
 <div style="display:flex;height:10px;border-radius:6px;overflow:hidden;background:#EEE;margin-top:6px"><div style="width:${w(h.ok)}%;background:#16A34A"></div><div style="width:${w(h.all-h.ok-h.n)}%;background:#E11D48"></div><div style="width:${w(h.n)}%;background:#94A3B8"></div></div></div>
 <div style="min-width:150px;text-align:right"><div><b style="font-size:20px;color:#C026D3">${h.vw.length}</b> <span class="mute">คู่เลือกว่ายาก</span></div><b style="font-size:16px">${h.all?Math.round(h.pc*100):'-'}%</b> <span class="mute">ตอบถูก</span><div class="mute" style="font-size:13px">ถูก ${h.ok} ผิด ${h.all-h.ok-h.n} หมดเวลา ${h.n}</div></div></div>`}).join('')}
 <div class="mute" style="margin-top:10px;font-size:13px">เขียว ตอบถูก แดง ตอบผิด เทา หมดเวลา (นับเป็นคู่)</div></div>`;
}
let HS={i:0,ans:false};
function hardShow(i){HS={i,ans:false};drawHard()}
function drawHard(){
 const h=HQ[HS.i],q=h.q,ov=$('#proj')||document.body.appendChild(Object.assign(document.createElement('div'),{id:'proj',className:'proj'}));
 const bar=(lb,v,c)=>`<div style="margin:10px 0"><div style="display:flex;justify-content:space-between;font-size:20px"><b>${lb}</b><b>${v} คู่</b></div><div style="height:16px;border-radius:8px;background:#EDE9FE;overflow:hidden"><div style="height:100%;width:${h.all?v/h.all*100:0}%;background:${c}"></div></div></div>`;
 ov.innerHTML=`<div class="bar"><span class="alias">ข่าวที่ตัดสินยากอันดับ ${HS.i+1}</span>
 <button class="tab" ${HS.i<=0?'disabled':''} onclick="HS={i:HS.i-1,ans:false};drawHard()">ก่อนหน้า</button><button class="tab" ${HS.i>=HQ.length-1?'disabled':''} onclick="HS={i:HS.i+1,ans:false};drawHard()">ถัดไป</button>
 <button class="tab" onclick="document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{})">เต็มจอ</button><button class="tab" onclick="$('#proj').remove()">ปิด</button></div>
 <div style="display:flex;gap:20px;margin-top:18px;flex-wrap:wrap;align-items:flex-start">
 <iframe src="index.html?show=${q.id}" style="flex:0 0 480px;max-width:100%;height:78vh;border:0;border-radius:16px;background:transparent"></iframe>
 <div style="flex:1;min-width:300px">
 <div class="card"><div class="hd" style="font-size:24px;font-weight:700">ห้องเราตอบว่า</div>${bar('จริง',h.t,'#0EA5E9')}${bar('หลอก',h.f,'#F97316')}${bar('หมดเวลา',h.n,'#94A3B8')}
 <div class="hd" style="font-size:22px;margin-top:14px;color:#6D28D9">ถามห้อง: เลือกเพราะอะไร สังเกตจากตรงไหน</div></div>
 ${h.vw.length?`<div class="card"><div class="hd" style="font-size:22px;font-weight:700">เหตุผลที่ตัดสินยาก (${h.vw.length} คู่)</div>${h.vw.map(w=>`<div style="font-size:19px;line-height:1.55;padding:8px 0;border-bottom:1px solid #EEE">${esc(String(w||'').replace(/^ข่าว "[^"]*" /,''))}</div>`).join('')}</div>`:''}
 ${HS.ans?`<div class="card" style="border:3px solid ${q.a?'#16A34A':'#E11D48'}"><div class="hd" style="font-size:30px;font-weight:700;color:${q.a?'#16A34A':'#E11D48'}">ข่าวนี้${q.a?'จริง':'หลอก'}</div>
 <div style="font-size:20px;line-height:1.6;margin:8px 0">${esc(q.why)}</div>${(q.sig||[]).map(s=>`<span class="badge b-wait" style="font-size:16px;margin:3px">${SIG[s]}</span>`).join('')}${(q.good||[]).map(s=>`<span class="badge b-ok" style="font-size:16px;margin:3px">${esc(s)}</span>`).join('')}</div>`
 :`<button class="red" style="width:100%;font-size:22px;padding:16px" onclick="HS.ans=true;drawHard()">เฉลย</button>`}
 </div></div>`;
}

function delWork(kind,id,name){
 const d=document.createElement('div');d.className='modal';d.style.cssText='position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center;padding:16px';
 d.innerHTML=`<div class="card" style="max-width:440px;width:100%"><div class="hd" style="font-size:20px;font-weight:700;color:#C8102E">ลบงานของ ${esc(name)}</div>
 <p style="line-height:1.6">คำตอบทุกกิจกรรม ใบงาน ข่าวที่แต่ง ข้อความตอบไลน์ และการเดาของคู่นี้จะถูกลบ กู้คืนไม่ได้ ถ้าเครื่องนักเรียนยังเปิดเว็บอยู่ จะกลับไปหน้าเริ่มต้นให้ทำใหม่</p>
 <div style="display:flex;gap:8px;margin-top:12px"><button class="ghost" style="flex:1" id="dn">ยกเลิก</button><button class="red" style="flex:1" id="dy">ลบ</button></div></div>`;
 document.body.appendChild(d);d.querySelector('#dn').onclick=()=>d.remove();
 d.querySelector('#dy').onclick=async()=>{d.querySelector('#dy').disabled=true;
  try{await rpc(kind==='sheet'?'news_teacher_remove_sheet':'news_teacher_remove',kind==='sheet'?{p_pin:PIN,p_id:String(id)}:{p_pin:PIN,p_client:id});d.remove();toast('ลบแล้ว');if(kind==='sheet')list();else monitor()}
  catch(e){d.remove();toast('ลบไม่สำเร็จ')}};
}
</script>
</body>
</html>
